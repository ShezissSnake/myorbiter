# MyOrbiter's pipelines on gitlab.com. They run only when started: by hand (Build → Pipelines →
# New pipeline, or the pipelines API), or by pushing a release tag (release-<anything>). Never on a
# push to a branch or for a merge request: tests run on the developer's machine before merging.
#
# What a pipeline does is its `task` input, chosen in the New pipeline form:
#
#   release (default)  test ─ build ─ sign ─ publish ─ release ─ experimental ─ prune
#                      Builds the Linux AppImage and .deb and the Windows installer (cross-compiled
#                      with cargo-xwin) as build <n>, version 0.2.<n>. On main or a release tag it
#                      also signs, publishes and moves Experimental to the build; on any other branch
#                      it stops after `build` and leaves the downloads as that job's artifacts, for 3
#                      days.
#   promote            promote-check ─ promote: moves build <n> to Beta or Stable (main only).
#   pages              The website (scripts/site.mjs), on GitLab Pages (main only).
#
# The builder image (ci/Dockerfile), which every job but `sign` and `release` runs in, isn't built
# here: ci/build-image.sh builds it on the maintainer's computer, pushes it with a deploy token and
# prints the digest for BUILDER_DIGEST.
#
# Build numbers: <n> is this pipeline's number in the project (CI_PIPELINE_IID, which only grows)
# plus BUILD_OFFSET. The offset keeps the numbers above those of the builds made on GitHub before
# the move (all below 100), so no version is ever made twice and versions only grow. Promoting
# and pages pipelines use a number too, so build numbers have gaps.
#
# Where things live (ci/lib.sh): every file of build <n> in the project's generic package
# registry as myorbiter/0.2.<n>/<file>, beside a release build-<n> that links to them; each
# channel's latest.json as channel/<stable|beta|experimental>/latest.json, the address installed
# copies check (src-tauri/src/updates.rs). Promote moves the same signed files, never a rebuild.
# Pruning keeps the newest 10 Experimental builds (not counting the builds a channel keeps) and
# never deletes a build a channel names or one ever promoted to Stable; a deleted build's tag stays.
#
# Signing: TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD are CI/CD variables of
# the project (Settings → CI/CD → Variables): protected (main and protected tags only), masked and
# hidden, of type Variable, with the environment scope `release-signing`. GitLab gives them only to
# jobs in that environment, and only `sign` is: it runs in its own upstream Node image pinned by
# digest (never the builder image, which jobs that run build code could replace), takes nothing from
# earlier jobs but their files (no variables), builds and installs nothing, runs the repository's
# dependency-free signer (scripts/updater-sign.mjs, which never prints the key) with an emptied
# environment, and keeps only the .sig files as artifacts. It has no checkout from the runner: it
# clones this commit into a folder of its own container, never the build volume earlier jobs share,
# with no git hook and no git config but its own, and takes the signer and the public key from that
# clone, running the signer only if it matches SIGNER_SHA256 below (this file is read by GitLab, not
# from the job's folder; tests/ciSigner.test.ts keeps the checksums current). From the build volume
# it takes only the build's files, release-files/, which build code that turned hostile could have
# made: it refuses links there and signs only the files this build makes. It also signs only builds
# made in the builder image by digest (BUILDER_DIGEST), since a tag in the container registry can be
# pushed over by any job's token. Either check failing stops the pipeline: nothing is published. The
# jobs that run npm, pnpm and Cargo build code never see the key. Without the key the build is still
# published, unsigned and on no channel. Release tags (release-*) must be protected tags, and
# pipeline variables kept off (Settings → CI/CD → Variables → Minimum role to use pipeline
# variables: No one allowed); the inputs below don't need them.
#
# What the key doesn't cover: every job's CI_JOB_TOKEN can write this project's packages and
# releases (GitLab has no per-job scope), so build code that turned hostile could replace a
# channel's latest.json or delete builds. Installed copies still install only a download whose
# signature, bound to its version, checks out against the public key they carry.
#
# Runners: every job, `sign` included, runs where the `runner` input says: `pc` (the default), the
# project runner (tag pc), or `cloud`, gitlab.com's hosted Linux runners (saas-linux-medium-amd64,
# which spend the namespace's compute minutes), an option nothing needs. A release tag push uses
# pc. Only a pipeline on a branch other than main runs on the hosted runners whatever the input
# says, since the pc runner is protected; such pipelines are optional (a branch's build tried
# before it is merged), and wait for a runner while the project's instance runners are off. The pc runner must use the Docker
# executor, is never privileged and never mounts the Docker socket: each keeps build code inside
# its job's container, off the runner's machine (and whatever else is on it) and away from the
# other jobs and caches. It is a protected runner, so only pipelines on main and protected tags run
# on it, as only they are given the signing key. `sign` runs there in its own clone with every
# check above.

# Anything that changes this file, ci/ or the signing variables: ask the maintainer first
# (CLAUDE.md).

spec:
  inputs:
    task:
      description: "What this pipeline does: release (build, and on main sign, publish and put on Experimental), promote (a build to Beta or Stable), pages (the website)."
      options: [release, promote, pages]
      default: release
    build:
      description: "promote: the build's number, the n of build-<n> (version 0.2.<n>)."
      default: "0"
      regex: ^[0-9]{1,9}$
    channel:
      description: "promote: the channel the build moves to."
      options: [beta, stable]
      default: beta
    windows:
      description: "release: build the Windows installer too. A build without it is published but can't go on a channel."
      type: boolean
      default: true
    runner:
      description: "Where every job runs in a pipeline started by hand on main or a release tag, sign included: pc (the project runner) or cloud (gitlab.com's hosted runners, which spend compute minutes). A release tag push uses pc; a pipeline on any other branch always uses the hosted runners."
      options: [pc, cloud]
      default: pc
---

variables:
  TASK: $[[ inputs.task ]]
  PROMOTE_BUILD: $[[ inputs.build ]]
  PROMOTE_CHANNEL: $[[ inputs.channel ]]
  RUNNER: $[[ inputs.runner ]]
  # The builder image (ci/Dockerfile), built on the maintainer's computer by ci/build-image.sh, which
  # pushes it as builder:<BUILDER_TAG> (for main; builder:<BUILDER_TAG>-<branch> for a branch) and
  # prints its digest. A tag can be pushed over by any job's token, so a tag alone is trusted for
  # nothing: pipelines on main and release tags run in the image by digest, BUILDER_DIGEST
  # (sha256:…, the digest ci/build-image.sh printed, put here through a merge request;
  # workflow:rules below). Until it is set they run in the tag, and `sign` refuses, so nothing is
  # published. ci/build-image.sh also pushes builder:<BUILDER_TAG>.<UTC time>, a tag no other push
  # writes (a branch's tag never has a dot), which keeps that digest tagged as long as no one
  # deletes it and the registry's cleanup policy keeps it (docs/maintaining.md). A branch's pipeline
  # runs in that branch's own tag. Changing the Dockerfile: a new BUILDER_TAG, ci/build-image.sh
  # once merged, then the new digest, in a merge request.
  BUILDER_TAG: "2026-11-07"
  BUILDER_DIGEST: "sha256:8e952523e6b8452fb780fbdccf1958d9a91bec0cc2176eedda2af3fd65031798"
  BUILDER_SUFFIX: ""
  BUILDER_IMAGE: $CI_REGISTRY_IMAGE/builder:$BUILDER_TAG$BUILDER_SUFFIX
  # The sign job's image: upstream Node, pinned by digest (node:26.13.0-bookworm, the one with git,
  # which sign clones with).
  SIGN_IMAGE: node:26.13.0-bookworm@sha256:a546d3f8acd2af4382668a7e6acd3bc4418e6a27478373e3246f8162f5181509
  # Build <n> is CI_PIPELINE_IID + BUILD_OFFSET. Every build made on GitHub before the move was
  # below 100, so no version here repeats one of theirs.
  BUILD_OFFSET: "100"
  # Experimental builds kept by prune, besides the ones a channel keeps.
  KEEP: "10"
  GLAB_IMAGE: registry.gitlab.com/gitlab-org/cli:v1.128.0@sha256:00884510ffcbb6b03c0abc5dd058d7728a646cab2a419de4a7108d073ce90a03
  # The SHA-256 of the signer's two files (`sha256sum scripts/updater-sign.mjs
  # scripts/updater-manifest.mjs`); `sign` runs them only if they match. A change to either file
  # changes these (tests/ciSigner.test.ts fails until they do).
  SIGNER_SHA256: "221a0b8c17f6df5474bf1fd54d03308639c6af454f8c02e2e0f0efc68a9ef84b 7a3c00804bc0733d60dc4fffb87d98c4dc2d0d445bc18bb21c22f3194675f3a4"

workflow:
  name: "$TASK: $CI_COMMIT_REF_NAME"
  rules:
    # A push starts a pipeline only for a release tag, and only to release. The build-<n> tags
    # the release job makes, branch pushes and merge requests start nothing. On main and release
    # tags, the builder image by digest once BUILDER_DIGEST is set.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^release-/ && $TASK == "release" && $BUILDER_DIGEST =~ /^sha256:[0-9a-f]{64}$/
      variables:
        RUNNER_TAG: pc
        BUILDER_IMAGE: $CI_REGISTRY_IMAGE/builder@$BUILDER_DIGEST
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^release-/ && $TASK == "release"
      variables:
        RUNNER_TAG: pc
    - if: $CI_PIPELINE_SOURCE == "push"
      when: never
    # By hand (New pipeline, or the pipelines API) on main or a release tag: the runner the input
    # names.
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG =~ /^release-/) && $RUNNER == "cloud" && $BUILDER_DIGEST =~ /^sha256:[0-9a-f]{64}$/
      variables:
        RUNNER_TAG: saas-linux-medium-amd64
        BUILDER_IMAGE: $CI_REGISTRY_IMAGE/builder@$BUILDER_DIGEST
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG =~ /^release-/) && $RUNNER == "cloud"
      variables:
        RUNNER_TAG: saas-linux-medium-amd64
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG =~ /^release-/) && $BUILDER_DIGEST =~ /^sha256:[0-9a-f]{64}$/
      variables:
        RUNNER_TAG: pc
        BUILDER_IMAGE: $CI_REGISTRY_IMAGE/builder@$BUILDER_DIGEST
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG =~ /^release-/)
      variables:
        RUNNER_TAG: pc
    # By hand on any other branch: always gitlab.com's hosted runners (the pc runner is protected
    # and takes no branch's jobs), and that branch's own builder image.
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      variables:
        RUNNER_TAG: saas-linux-medium-amd64
        BUILDER_SUFFIX: -$CI_COMMIT_REF_SLUG
    - when: never

default:
  image: $BUILDER_IMAGE
  tags: [$RUNNER_TAG]
  # A job that has started is never cancelled by a newer pipeline: nothing is half published.
  interruptible: false

stages: [test, build, sign, publish, release, channel, prune, promote, pages]

# Rules shared by the jobs below.
.release-task:
  rules:
    - if: $TASK == "release"
# Signing and everything after it: a release on main, or on a release tag (which publish checks is
# on main). Anywhere else the pipeline ends after `build`.
.publishing:
  rules:
    - if: $TASK == "release" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG =~ /^release-/)
# Cargo's download cache, per runner and kept apart for protected refs (main, release tags) and
# everything else, so a branch's pipeline can't leave files a release build then uses: never the
# target folders (each build starts clean). GitLab's own "Use separate caches for protected
# branches" setting stays on as well (docs/maintaining.md).
.cargo-cache:
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  cache:
    - key: cargo-$RUNNER_TAG-$CI_COMMIT_REF_PROTECTED
      paths: [.cargo-home/registry/index/, .cargo-home/registry/cache/, .cargo-home/git/db/]

# ------------------------------------------------------------------ release

# The tests the developer runs before merging, and a known vulnerability in either Cargo.lock
# (RustSec, cargo-audit) stops the pipeline before anything is built. cargo test runs on the MSRV
# (the image's default toolchain, Rust 1.95).
test:
  stage: test
  extends: [.release-task, .cargo-cache]
  script:
    # A release tag builds only a commit on main (the same check publish makes; protecting the
    # release-* tags is what keeps anyone else from making one).
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        if [ -f .git/shallow ]; then git fetch --quiet --unshallow origin; fi
        git fetch --quiet origin "+refs/heads/$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH"
        git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$CI_DEFAULT_BRANCH" ||
          { echo "$CI_COMMIT_TAG isn't on $CI_DEFAULT_BRANCH: nothing is built" >&2; exit 1; }
      fi
    - npm ci
    - npm test
    - npm run check -- --threshold error
    # The MSRV: both rust-version fields agree, name the image's default toolchain, and the whole
    # workspace with its tests builds on it from the lockfile.
    - |
      v=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml)
      d=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' crates/myorbiter-data/Cargo.toml)
      [[ "$v" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "no rust-version in src-tauri/Cargo.toml" >&2; exit 1; }
      [ "$d" = "$v" ] || { echo "crates/myorbiter-data says rust-version $d, src-tauri says $v" >&2; exit 1; }
      r=$(rustc --version | cut -d' ' -f2)
      [[ "$r" == "$v" || "$r" == "$v".* ]] || { echo "rust-version is $v but the image's toolchain is $r: change RUST_VERSION in ci/Dockerfile" >&2; exit 1; }
    - cargo check --workspace --tests --locked
    - (cd src-tauri && cargo test --locked)
    # Run as cargo-audit, not `cargo audit`, so rustup doesn't install TennoScope's toolchain only
    # to read a lockfile.
    - cargo-audit audit --file Cargo.lock
    - cargo-audit audit --file tennoscope/Cargo.lock

# Linux natively, then Windows cross-compiled, in one job (ci/build.sh). No key, no signing.
build:
  stage: build
  extends: [.release-task, .cargo-cache]
  needs: [test]
  timeout: 3h
  variables:
    XWIN_CACHE_DIR: $CI_PROJECT_DIR/.xwin-cache
    # Only the x86_64 Windows SDK and CRT (cargo-xwin otherwise fetches every architecture's).
    XWIN_ARCH: x86_64
  cache:
    - key: cargo-$RUNNER_TAG-$CI_COMMIT_REF_PROTECTED
      paths: [.cargo-home/registry/index/, .cargo-home/registry/cache/, .cargo-home/git/db/]
    - key: xwin-$RUNNER_TAG-$CI_COMMIT_REF_PROTECTED
      paths: [.xwin-cache/]
  script:
    - n=$((CI_PIPELINE_IID + BUILD_OFFSET))
    - echo "Build $n, version 0.2.$n, from ${CI_COMMIT_SHORT_SHA}"
    # The boolean input inside a longer string, so GitLab writes it as text (true or false).
    - if [ "$[[ inputs.windows ]]" = true ]; then ci/build.sh "0.2.$n"; else ci/build.sh "0.2.$n" --no-windows; fi
    - |
      if [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ] && [[ ! "${CI_COMMIT_TAG:-}" =~ ^release- ]]; then
        echo "Not published: built from $CI_COMMIT_REF_NAME, not $CI_DEFAULT_BRANCH. The downloads are this job's artifacts, for 3 days."
      fi
  # Files only: no dotenv report, so nothing this job writes becomes a variable of a later job.
  artifacts:
    expire_in: 3 days
    paths: [release-files/]

# Signs the AppImage and the setup.exe for the updater. The only job in the release-signing
# environment, so the only one given the key (see the top of this file). `action: prepare` makes
# no deployment. On the runner the `runner` input names (pc by default), and only for main and
# release tags, so on pc only the protected runner takes it. The pc runner's jobs share the
# executor's build volume, which build code could leave things in (files, git hooks, git config):
# so no checkout there, a clone of its own inside its container, and the checks below on the
# build's files, the one thing it takes from the volume.
sign:
  stage: sign
  extends: .publishing
  image: $SIGN_IMAGE
  needs:
    - job: build
      artifacts: true
  environment:
    name: release-signing
    action: prepare
  variables:
    # No checkout by the runner: no git runs in the shared build folder, where an earlier job could
    # have left hooks or config. The build's artifacts are still unpacked there (release-files/).
    GIT_STRATEGY: none
  script:
    - BUILD=$((CI_PIPELINE_IID + BUILD_OFFSET))
    # Only a build made in the builder image by digest is signed (BUILDER_DIGEST above).
    - |
      case "$BUILDER_IMAGE" in
        *@sha256:*) ;;
        *) echo "Nothing is signed or published: build $BUILD was made in $BUILDER_IMAGE, a tag, not a digest. Put the digest ci/build-image.sh printed in BUILDER_DIGEST (.gitlab-ci.yml)." >&2; exit 1 ;;
      esac
    # This commit, cloned into folders of this container's own (mktemp: /tmp, not the build volume
    # under /builds). Git reads no system or user config (an empty HOME, GIT_CONFIG_NOSYSTEM,
    # GIT_CONFIG_GLOBAL), and its hooks and template are an empty folder, so nothing an earlier job
    # left anywhere runs. CI_REPOSITORY_URL carries the job's token; git keeps no remote with it.
    - |
      empty=$(mktemp -d) src=$(mktemp -d)
      export HOME="$(mktemp -d)" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
      git -C "$src" init -q --template="$empty"
      git -C "$src" config core.hooksPath "$empty"
      git -C "$src" fetch -q --depth 1 --no-tags "$CI_REPOSITORY_URL" "$CI_COMMIT_SHA" ||
        git -C "$src" fetch -q --depth 50 --no-tags "$CI_REPOSITORY_URL" "$CI_COMMIT_REF_NAME"
      git -C "$src" -c advice.detachedHead=false checkout -q "$CI_COMMIT_SHA"
      [ "$(git -C "$src" rev-parse HEAD)" = "$CI_COMMIT_SHA" ] || { echo "Nothing is signed or published: the clone isn't $CI_COMMIT_SHA" >&2; exit 1; }
    # The signer and the public key from that clone, run only if they are the signer this file
    # names (SIGNER_SHA256), before the key is anywhere near them.
    - signer=$(mktemp -d)
    - cp "$src/scripts/updater-sign.mjs" "$src/scripts/updater-manifest.mjs" "$src/src-tauri/tauri.conf.json" "$signer/"
    - |
      [ "$(cd "$signer" && sha256sum updater-sign.mjs updater-manifest.mjs | cut -d' ' -f1 | tr '\n' ' ' | sed 's/ $//')" = "$SIGNER_SHA256" ] ||
        { echo "Nothing is signed or published: scripts/updater-sign.mjs or scripts/updater-manifest.mjs isn't the signer SIGNER_SHA256 names" >&2; exit 1; }
    # From the build volume, only release-files/, as the build's artifacts left it: a folder, not a
    # link, with no link in it (one could send a .sig somewhere else). Only the files this build
    # makes are signed (below), so nothing an earlier job left there is. Old signatures go first.
    - |
      [ -d release-files ] && [ ! -L release-files ] || { echo "Nothing is signed or published: no release-files folder" >&2; exit 1; }
      links=$(find release-files -type l -print)
      [ -z "$links" ] || { echo "Nothing is signed or published: release-files holds links: $links" >&2; exit 1; }
      find release-files -maxdepth 1 -type f -name '*.sig' -delete
    # Tested without expanding it, so not even a debug trace could show it.
    - |
      if [ -z "${TAURI_SIGNING_PRIVATE_KEY:+set}" ]; then
        echo "No updater files: TAURI_SIGNING_PRIVATE_KEY isn't given to this job (a protected variable in the release-signing environment), so build $BUILD is published unsigned and no channel will offer it."
        exit 0
      fi
    - version="0.2.$BUILD"
    - files=("release-files/myorbiter_${version}_amd64.AppImage")
    # The setup.exe exactly when this pipeline built Windows (the boolean inside a longer string, as
    # in build), never a stale one.
    - if [ "$[[ inputs.windows ]]" = true ]; then files+=("release-files/myorbiter_${version}_x64-setup.exe"); fi
    - |
      for f in "${files[@]}"; do
        [ -f "$f" ] && [ ! -L "$f" ] || { echo "Nothing is signed or published: $f is missing" >&2; exit 1; }
      done
    # Each signature is bound to this version and checked against tauri.conf.json's public key
    # before it's written. The signer runs with every other exported variable removed (no
    # NODE_OPTIONS, LD_PRELOAD or PATH from anywhere) and the key passed by name, never on a
    # command line.
    - |
      (
        for v in $(compgen -e); do
          case "$v" in TAURI_SIGNING_PRIVATE_KEY|TAURI_SIGNING_PRIVATE_KEY_PASSWORD) ;; *) unset "$v" 2>/dev/null || true ;; esac
        done
        export PATH=/usr/local/bin:/usr/bin:/bin
        exec node "$signer/updater-sign.mjs" --config "$signer/tauri.conf.json" --version "$version" "${files[@]}"
      )
    - unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
    # Once more, with the manifest script's check (the app's), the key gone from the environment
    # and nothing else in it either.
    - for sig in release-files/*.sig; do env -i PATH=/usr/local/bin:/usr/bin:/bin node "$signer/updater-manifest.mjs" verify --config "$signer/tauri.conf.json" --file "${sig%.sig}" --sig "$sig" --version "$version"; done
  artifacts:
    expire_in: 3 days
    paths: [release-files/*.sig]

# The release's files: source, latest.json, SHA256SUMS, every file checked and put in the package
# registry (ci/publish.sh).
publish:
  stage: publish
  extends: .publishing
  needs:
    - job: build
      artifacts: true
    - job: sign
      artifacts: true
  variables:
    # The whole history, for the release notes since the build on Experimental.
    GIT_DEPTH: "0"
  script:
    - ci/publish.sh "$((CI_PIPELINE_IID + BUILD_OFFSET))"
  artifacts:
    expire_in: 3 days
    paths: [release-links.json]
    reports:
      dotenv: publish.env

# The build-<n> release, at this commit, linking to every file. Made with glab, which replaces
# release-cli; a re-run finds the release already there and leaves it.
release:
  stage: release
  extends: .publishing
  image: $GLAB_IMAGE
  needs:
    - job: publish
      artifacts: true
  variables:
    GIT_STRATEGY: none
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - |
      if glab release view "build-$BUILD" -R "$CI_PROJECT_PATH" >/dev/null 2>&1; then
        echo "The release build-$BUILD is already there."
      else
        glab release create "build-$BUILD" -R "$CI_PROJECT_PATH" --ref "$CI_COMMIT_SHA" --no-update \
          --name "MyOrbiter $VERSION (build-$BUILD)" \
          --notes "MyOrbiter $VERSION, built from $CI_COMMIT_SHORT_SHA. The AppImage is for Linux and the Steam Deck, the .deb for Debian and Ubuntu, the setup.exe for Windows, whichever this pipeline built. MyOrbiter and the TennoScope inside it are GPL-3.0-only: myorbiter-source.tar.gz is the complete source of this build. SHA256SUMS lists every file's checksum." \
          --assets-links "$(cat release-links.json)"
      fi

# The build becomes Experimental's, never moving the channel backwards (ci/experimental.sh).
experimental:
  stage: channel
  needs:
    - job: publish
      artifacts: true
    - job: release
  rules:
    - if: $TASK == "release" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG =~ /^release-/)
  resource_group: channels
  variables:
    GIT_DEPTH: "1"
  script:
    - |
      if [ "$COMPLETE" != true ]; then
        echo "Build $BUILD stays off Experimental: it isn't signed, or has no Windows installer."
        exit 0
      fi
    - ci/experimental.sh "$VERSION"

# Older Experimental builds go (ci/prune.sh).
prune:
  stage: prune
  extends: .publishing
  needs: [experimental]
  resource_group: channels
  variables:
    GIT_DEPTH: "1"
  script:
    - ci/prune.sh

# ------------------------------------------------------------------ promote

# Checks build <n> (ci/promote.sh check); `promote` then copies exactly the latest.json it checked.
promote-check:
  stage: promote
  rules:
    - if: $TASK == "promote" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GIT_DEPTH: "1"
  script:
    - ci/promote.sh check "$PROMOTE_BUILD"
  artifacts:
    reports:
      dotenv: promote.env

promote:
  stage: promote
  rules:
    - if: $TASK == "promote" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: promote-check
      artifacts: true
  resource_group: channels
  variables:
    GIT_DEPTH: "1"
  script:
    - ci/promote.sh promote "$PROMOTE_BUILD" "$PROMOTE_CHANNEL"

# ------------------------------------------------------------------ website

# The site, built and checked (ci/pages.sh), published from public/ on GitLab Pages.
pages:
  stage: pages
  rules:
    - if: $TASK == "pages" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GIT_DEPTH: "1"
  script:
    - ci/pages.sh
  pages: true
  artifacts:
    paths: [public]
