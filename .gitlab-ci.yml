# MyOrbiter's home is on GitHub (github.com/ShezissSnake/myorbiter): builds, releases, update
# channels and the website are made there (.github/workflows/release.yml). This project on gitlab.com
# is its mirror. It keeps the releases and packages GitLab made (builds 0.2.100 to the bridge build)
# and the channels' latest.json in its package registry, which installed copies ask after GitHub;
# nothing here changes them.
#
# The one pipeline left publishes GitLab Pages as a redirect: each page of the old website
# (sheziss-group.gitlab.io/myorbiter) sends the browser to the same page on GitHub Pages
# (shezisssnake.github.io/myorbiter), and any other address to its front page. It runs only when
# started by hand on main (Build → Pipelines → New pipeline), never on a push or a merge request,
# and needs no secret: the signing variables are no longer used (docs/maintaining.md, GitLab, the
# mirror).
#
# Anything that changes this file or ci/: ask the maintainer first (CLAUDE.md).

spec:
  inputs:
    runner:
      description: "Where the job runs: pc (the project runner) or cloud (gitlab.com's hosted runners, which spend compute minutes)."
      options: [pc, cloud]
      default: pc
---

workflow:
  name: "pages: $CI_COMMIT_REF_NAME"
  rules:
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RUNNER == "cloud"
      variables:
        RUNNER_TAG: saas-linux-small-amd64
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        RUNNER_TAG: pc
    - when: never

variables:
  RUNNER: $[[ inputs.runner ]]
  # The builder image the release pipelines last ran in (ci/Dockerfile), by digest: the job needs
  # only a shell, and this image is already on the project runner.
  BUILDER_DIGEST: "sha256:8e952523e6b8452fb780fbdccf1958d9a91bec0cc2176eedda2af3fd65031798"
  SITE: "https://shezisssnake.github.io/myorbiter/"

pages:
  image: $CI_REGISTRY_IMAGE/builder@$BUILDER_DIGEST
  tags: [$RUNNER_TAG]
  interruptible: false
  variables:
    GIT_STRATEGY: none
  script:
    - |
      set -eu
      rm -rf public
      # A page per address the old site had, each pointing at the same page on GitHub Pages; 404.html
      # (any other address) points at the front page. Constant markup, no script.
      page() {
        mkdir -p "public/$(dirname "$1")"
        cat >"public/$1" <<EOF
      <!doctype html>
      <html lang="en">
      <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="robots" content="noindex">
      <meta http-equiv="refresh" content="0; url=$2">
      <link rel="canonical" href="$2">
      <title>MyOrbiter has moved</title>
      </head>
      <body>
      <p>MyOrbiter's website has moved to <a href="$2">$2</a>.</p>
      </body>
      </html>
      EOF
      }
      for p in index.html downloads.html whats-new.html guide/index.html guide/pages.html guide/your-game.html guide/getting-around.html; do
        target="$SITE${p%index.html}"
        page "$p" "$target"
      done
      page 404.html "$SITE"
      find public -type f | sort
  pages: true
  artifacts:
    paths: [public]
