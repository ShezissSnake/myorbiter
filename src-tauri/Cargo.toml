[package]
name = "orbiter"
version = "0.1.0"
description = "Local-first Warframe collection helper built on TennoScope's data."
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.77.2"

[features]
# For the end-to-end test of updating only: lets ORBITER_UPDATER_E2E_ENDPOINT point update checks at
# a local http server (updates.rs, `e2e`). Never enabled in a release: release.yml fails any build
# whose binary carries that name.
e2e-updater = []

[lib]
name = "orbiter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Remembers window size (and position where the compositor allows it).
tauri-plugin-window-state = "2"
# Opens wiki and warframe.market links in the browser.
tauri-plugin-opener = "2"
# One orbiter at a time: two would each keep their own settings and log the same trades twice.
tauri-plugin-single-instance = "2"
# The riven key: read the inventory from in game, for the riven cycle overlay. On Linux it works
# while an X11 window has focus, which a game under Proton/Wine is.
tauri-plugin-global-shortcut = "2"
orbiter-data = { path = "../crates/orbiter-data" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Fissures and Varzia's stock from api.warframestat.us. Blocking client, run off the main thread.
ureq = { version = "2", features = ["json", "native-certs"] }
# Keeps the warframe.market token in the system keyring (KWallet / GNOME Keyring on Linux, the
# Credential Manager on Windows, the Keychain on macOS). Each feature only builds on its system.
keyring = { version = "3", features = ["sync-secret-service", "vendored", "crypto-rust", "windows-native", "apple-native"] }
# Your warframe.market status is held on a WebSocket (see presence.rs). rustls with ring, the
# same TLS stack ureq already links, and the system's certificates like ureq's.
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Shrinks item artwork to thumbnails before caching it.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Desktop notifications: the desktop's own notification service (D-Bus) on Linux, the Action
# Center on Windows, the Notification Center on macOS.
notify-rust = "4"
# Nox's Frame build codes (noxsframe.rs): zlib-packed, base64url. Both already in the build
# through ureq; named here to use them directly.
flate2 = "1"
base64 = "0.22"
# orbiter's own log file (applog.rs): the standard logging front end, already in the build through Tauri.
log = "0.4"
# In-app updates from orbiter's GitHub releases (updates.rs): checks a channel's manifest, verifies
# the download's signature, replaces the AppImage or runs the Windows installer. 2.14.1 at least:
# it extracts with zip 9 (earlier 2.x pull in zip 4, which has open advisories).
tauri-plugin-updater = "2.14.1"
# Restarts orbiter once an update is in place (the page calls its `restart`).
tauri-plugin-process = "2.4.0"
# Comparing versions (0.1.52 against 0.1.9 by number), already in the build through Tauri.
semver = "1"
[target.'cfg(unix)'.dependencies]
# Ctrl+C / logout: close the TennoScope orbiter started before exiting.
signal-hook = "0.3"
# Stopping that TennoScope, and the user id for the private bridge folder.
libc = "0.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
# Finding, and stopping, the TennoScope orbiter started (Linux reads /proc itself).
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
