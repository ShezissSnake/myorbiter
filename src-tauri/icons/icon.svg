<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d23"/>
      <stop offset="1" stop-color="#0b0c0f"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="140" y1="140" x2="884" y2="884">
      <stop offset="0" stop-color="#f0cf72"/>
      <stop offset=".55" stop-color="#d6ae4a"/>
      <stop offset="1" stop-color="#9c7a2e"/>
    </linearGradient>
    <radialGradient id="core" cx=".38" cy=".34" r=".75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#dfe4ea"/>
      <stop offset="1" stop-color="#9aa3ad"/>
    </radialGradient>
  </defs>
  <!-- Orokin plate: a square with cut corners -->
  <path d="M176 48H848L976 176V848L848 976H176L48 848V176Z" fill="url(#slab)"/>
  <path d="M190 82H834L942 190V834L834 942H190L82 834V190Z" fill="none" stroke="url(#gold)" stroke-width="10" opacity=".9"/>
  <path d="M206 112H818L912 206V818L818 912H206L112 818V206Z" fill="none" stroke="#d6ae4a" stroke-width="3" opacity=".35"/>
  <!-- orbit (back half behind the core) -->
  <g transform="rotate(-20 512 512)">
    <path d="M152 512A360 140 0 0 1 872 512" fill="none" stroke="url(#gold)" stroke-width="40"/>
  </g>
  <!-- core -->
  <circle cx="512" cy="512" r="150" fill="url(#core)"/>
  <circle cx="512" cy="512" r="150" fill="none" stroke="#0b0c0f" stroke-width="6" opacity=".35"/>
  <!-- orbit (front half over the core) -->
  <g transform="rotate(-20 512 512)">
    <path d="M872 512A360 140 0 0 1 152 512" fill="none" stroke="#0b0c0f" stroke-width="64"/>
    <path d="M872 512A360 140 0 0 1 152 512" fill="none" stroke="url(#gold)" stroke-width="40"/>
  </g>
  <!-- moon: an Orokin diamond riding the orbit -->
  <g transform="translate(818 334) rotate(45)">
    <rect x="-52" y="-52" width="104" height="104" fill="#0b0c0f"/>
    <rect x="-38" y="-38" width="76" height="76" fill="url(#gold)"/>
  </g>
</svg>
