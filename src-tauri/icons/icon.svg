<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The app icon's master: an invented craft seen from above on the app's cut plate. A broad
       delta whose prow breaks through the top of its own ring wing; the ring sweeps back from the
       prow and opens in one small gap at the tail, and one gold engine sits in the stern's V notch.
       Flat colour only: a lit left half, a shaded right half and the gold, separated by colour and
       negative space, mirror-symmetric about x=50.
       `npm run icons` renders every size from this file: 48 px and up from #plate and
       #hull-detailed, below 48 px from #plate and #hull-simple (the same drawing with thicker parts
       and a stockier delta). Plain hex colours, no text, filters, gradients or transforms, and no
       nested groups: the render script swaps the two hull groups by id. -->
  <g id="plate">
    <polygon points="0,12 12,0 100,0 100,88 88,100 0,100" fill="#9ba2ac"/>
    <polygon points="3,13.24 13.24,3 97,3 97,86.76 86.76,97 3,97" fill="#24272d"/>
  </g>
  <g id="hull-detailed">
    <path d="M 50,9 L 47.136,17.114 A 36,36 0 0 0 47,88.875 L 47,81.836 A 27.5,27.5 0 0 1 43.36,27.814 L 32,60 L 50,51 Z" fill="#e6e9ee"/>
    <path d="M 50,9 L 52.864,17.114 A 36,36 0 0 1 53,88.875 L 53,81.836 A 27.5,27.5 0 0 0 56.64,27.814 L 68,60 L 50,51 Z" fill="#9ba2ac"/>
    <path d="M 44.5,52 L 55.5,52 L 58,60 L 42,60 Z" fill="#d6ae4a"/>
  </g>
  <g id="hull-simple" display="none">
    <path d="M 50,6.25 L 46.362,15.677 A 37.5,37.5 0 0 0 46.875,90.37 L 46.875,80.563 A 26.25,26.25 0 0 1 40.88,29.885 L 29.5,59.375 L 50,53.125 Z" fill="#e6e9ee"/>
    <path d="M 50,6.25 L 53.638,15.677 A 37.5,37.5 0 0 1 53.125,90.37 L 53.125,80.563 A 26.25,26.25 0 0 0 59.12,29.885 L 70.5,59.375 L 50,53.125 Z" fill="#9ba2ac"/>
    <path d="M 43.75,50 L 56.25,50 L 59.375,59.375 L 40.625,59.375 Z" fill="#d6ae4a"/>
  </g>
</svg>
