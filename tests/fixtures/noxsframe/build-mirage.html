<!DOCTYPE html><html lang="en"><head><script type="application/ld+json">{"@context":"https://schema.org","@type":"CreativeWork","name":"Mirage Prime - Glaive Prime Build","description":"Mirage Prime as a buff platform for a heavy-throw Glaive Prime. Mirage stacks damage through Eclipse, Xata's Whisper and Arcane Fury. The Glaive is charge-thrown into a group and detonated mid-air. Toxin and Blast damage, yellow crits and Melee Duplicate do the rest.\n\nWhat matters\nMax energy above 500: Primed Flow takes Mirage to 641 energy. Only above 500 do the five Violet Archon Shards double their melee crit damage. Primed Flow stays in, even at the cost of efficiency.\nYellow crits: Melee Duplicate only makes yellow crits hit a second time. That's why crit chance deliberately stays below 100%.\nStrength for the buffs: 313% in the arsenal, and more during missions from Growing Power (status effects) and Molt Augmented (stacks with kills, lasts until death).\nDuration for uptime: Eclipse, Hall of Mirrors and Xata's Whisper last a long time, so you rarely recast.\n\nPlaystyle\nGet your buffs up, charge-throw the Glaive, detonate it inside the group, repeat. Kills build Initial Combo through Galvanized Reflex, and Melee Elementalist speeds up the charge. Don't stand still: with around 900 effective health, Mirage can't take much. Roll (Rolling Guard), use the clones as a distraction, and switch Eclipse to damage reduction when needed.\n\nRequirements: Melee Arcane Adapter, Galvanized mods and Archon Shards. This is an endgame build.","author":{"@type":"Person","name":"Author One"},"datePublished":"2026-11-01T10:09:20.023Z","dateModified":"2026-11-01T10:17:41.148Z","url":"https://noxsframe.com/builds/02OZ99LT_8kP-mirage-prime-glaive-prime-build","inLanguage":"en","about":{"@type":"Thing","name":"Mirage Prime"},"image":"https://noxsframe.com/img/MiragePrime.png","isPartOf":{"@type":"VideoGame","name":"Warframe"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Community builds","item":"https://noxsframe.com/builds"},{"@type":"ListItem","position":2,"name":"Mirage Prime - Glaive Prime Build","item":"https://noxsframe.com/builds/02OZ99LT_8kP-mirage-prime-glaive-prime-build"}]}</script></head><body><div class="flex flex-wrap"><a class="chip h-7 text-xs text-accent-4 [--cut-line:color-mix(in_srgb,var(--accent-3)_55%,var(--line-2))]" title="Game mode" href="/builds?mode=allround">All-round</a><a class="chip h-7 text-xs text-accent-4 [--cut-line:color-mix(in_srgb,var(--accent-3)_55%,var(--line-2))]" title="Game mode" href="/builds?mode=steelpath">Steel Path</a><a class="chip h-7 text-xs text-accent-4 [--cut-line:color-mix(in_srgb,var(--accent-3)_55%,var(--line-2))]" title="Game mode" href="/builds?mode=archon">Archon Hunt</a><a class="chip h-7 text-xs text-accent-4 [--cut-line:color-mix(in_srgb,var(--accent-3)_55%,var(--line-2))]" title="Game mode" href="/builds?mode=farming">Farming</a></div><script>self.__next_f.push([1,"21:[\"$\",\"$La4\",null,{\"code\":\"$a5\",\"labels\":{\"title\":\"Community builds\"}}]\na5:Tb40,NFB1:eNrtWm1v2zgS_isDFYt2c6qdtNvDnb_lrUmwm00vSdtbJP4wlkYSEYrUDkk72kX_-2FI23Hz0qTdAncH-EtgyeS8PvPMkM6f2ZTYKWuy0VaeGWwpG2XHirEmeMeqJXgJBxrVdPG4E5Quszwz1pPLRtmzZ3BqPXplzaXZGsDGxiFqDbaCY8Vs2cGLrR9HGxuwq60hByXjDLCu2QKaElynlQcy1PZQKabBpXklQv6NHp87-Ngo1xHDi1c5HJJulfFNDkydxoIcnGlSdeNF2yGaMurZLksHH6wqocRW3PAWehsYZoSdNW5waV5HM60uYb_QqnMEL17HvR_jksXGSaiqARxV4Btlagc1eWAb6iYHjx0oD5XlxWKmMhQSBVDGecJycGl-GsBug1zTS9-wncHGxsXFajDH440NUMZb8A1BzTZ0OZTkrUFPIr9V5UtUnEMRxQDWqAxw9Bln2A8uzZsBnFKBzkdzHUyoskwisAcOBmzwA9g3xHUPhW3JQcW2hYZQ-wYsTxxMFcLFxf7vQWk1YRXa8Xhwad6xci28-OlHUA5sJ66hBmUkGg4mAoPBpbk0z57Bx6YXa2eWr9yleRn9jA6W8Fbb2XgMf4MPymrysM1FYw2cNcili-ma2CnBm81NaPFagMB1n8d4uLjmObSkiaBg5RexLm2YaHID-Kh8Y4OHFWWSa9DWETS"])</script><script>self.__next_f.push([1,"oK0HGUhZMrAmS_2ThcZS7FzqtCvQ0Hos5v5EWIaLNQaM8IDgqrCnBq5YGsCtmFA2aggCj6Vubmz_ABJl0Dx32DmxVQUN
