[package]
name = "myorbiter-data"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-only"
description = "Reads TennoScope's local collection data (read-only) and trims the item catalog for MyOrbiter."

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"

[[bin]]
name = "myorbiter-dump"
path = "src/bin/dump.rs"
