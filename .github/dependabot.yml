# Dependabot proposes updates as pull requests, once a week; nothing is merged by itself.
# - GitHub Actions: every workflow pins its actions to a commit, and these keep the pins current.
# - Cargo: orbiter's workspace (Cargo.lock at the root: src-tauri and crates/orbiter-data) and
#   TennoScope's (tennoscope/Cargo.lock).
# - npm: orbiter's window (package-lock.json) and TennoScope's (tennoscope/app, pnpm).
# Minor and patch updates come grouped, one pull request per ecosystem and folder; a major version
# comes on its own, since it may need code changes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: /tennoscope
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tennoscope-cargo-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /tennoscope/app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tennoscope-npm-minor:
        update-types: ["minor", "patch"]
