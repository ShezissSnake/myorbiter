name: Nightly Experimental build

# Starts a release build (release.yml) once a night, but only when main has moved since the newest
# build: the commit main is at is compared with the one the highest build-<n> tag names, and a
# night with nothing new on main builds nothing. A release run of that same commit that is still
# queued or running counts as built. A build that failed before publishing left no tag, so the next
# night tries again.
#
# While the repository is private this starts nothing (Actions minutes are limited there; it asks
# the API, since a scheduled run's event doesn't say); runs started by hand on release.yml still
# build. GitHub turns a schedule off after 60 days without activity in the repository: Actions →
# Nightly Experimental build → Enable workflow turns it on again. A main that fails to build is
# tried again each night until it builds. Promote (promote.yml) and the pruning of old
# Experimental builds (release.yml, prune) are unchanged.
#
# This job checks out no code and runs only gh and jq. Its token can read the repository and start
# workflows, nothing else; the build itself runs with release.yml's own permissions.

on:
  schedule:
    - cron: "17 3 * * *"
  # By hand: the same check, for trying it out. To build regardless, use release.yml's Run workflow.
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  start:
    name: Build main if it changed
    runs-on: ubuntu-24.04
    permissions:
      contents: read # main's commit and the build-<n> tags
      actions: write # to start release.yml
    steps:
      - name: Compare main with the newest build, start one if they differ
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Asked of the API, not the event: a scheduled run's event says nothing about the repository.
          if [ "$(gh api "repos/$REPO" --jq .private)" != false ]; then
            echo "The repository is private: no nightly build (Actions minutes are limited there)." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          head=$(gh api "repos/$REPO/commits/main" --jq .sha)

          # The highest build-<n> tag and the commit it names (lightweight tags name the commit;
          # an annotated one is followed to it).
          # A failed call stops the job here (set -e), rather than reading as "no build yet".
          refs=$(gh api --paginate "repos/$REPO/git/matching-refs/tags/build-" \
            --jq '.[] | "\(.ref | ltrimstr("refs/tags/build-")) \(.object.type) \(.object.sha)"')
          newest=$(printf '%s\n' "$refs" | { grep -E '^[0-9]+ ' || true; } | sort -n | tail -n1)
          built=""
          if [ -n "$newest" ]; then
            read -r n type sha <<<"$newest"
            if [ "$type" = tag ]; then sha=$(gh api "repos/$REPO/git/tags/$sha" --jq .object.sha); fi
            built=$sha
          fi

          if [ "$built" = "$head" ]; then
            echo "main is at ${head::7}, already build-$n: nothing to build tonight." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          running=$(gh api "repos/$REPO/actions/workflows/release.yml/runs?branch=main&per_page=30" |
            jq --arg h "$head" '[.workflow_runs[] | select(.status != "completed" and .head_sha == $h)] | length')
          if [ "$running" -gt 0 ]; then
            echo "A release run of ${head::7} is already queued or running: nothing started." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh workflow run release.yml --repo "$REPO" --ref main -f windows=true -f macos=false
          if [ -n "$built" ]; then since="since build-$n (${built::7})"; else since="and no build-<n> tag exists yet"; fi
          echo "main is at ${head::7} $since: release build started." >>"$GITHUB_STEP_SUMMARY"
