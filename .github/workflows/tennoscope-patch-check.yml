name: TennoScope patch check

# Once a week: does orbiter's TennoScope patch still apply to TennoScope's latest code? The run
# fails (and GitHub e-mails you) when it doesn't, so the patch gets rebased before an update needs
# it, not during a fissure. While it applies, the run's summary lists what TennoScope changed since
# the commit orbiter builds on, to judge whether moving the pin is worth a build.
#
# It only tries the patch; it doesn't build. A patch that applies can still break the build, which
# the next Release builds run shows.

on:
  schedule:
    - cron: "23 7 * * 1" # Mondays, 07:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Try the patch on TennoScope's latest code
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Apply the patch to TennoScope main
        run: |
          # The repository and pin the release builds use, so the two never disagree.
          repo=$(sed -n 's/^  TENNOSCOPE_REPO: //p' .github/workflows/release.yml)
          pinned=$(sed -n 's/^  TENNOSCOPE_COMMIT: //p' .github/workflows/release.yml)
          git clone --quiet "$repo" tennoscope
          latest=$(git -C tennoscope rev-parse --short HEAD)
          newer=$(git -C tennoscope rev-list --count "$pinned..HEAD")
          {
            echo "## TennoScope patch check"
            echo
            echo "orbiter builds TennoScope at \`$pinned\`. TennoScope's latest is \`$latest\`, $newer commit(s) newer."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if git -C tennoscope apply --check "$GITHUB_WORKSPACE/patches/tennoscope-orbiter.patch" 2> apply-errors.txt; then
            echo "The patch still applies to the latest TennoScope." >> "$GITHUB_STEP_SUMMARY"
            ok=1
          else
            {
              echo "**The patch no longer applies to the latest TennoScope.** Rebase it (patches/README.md) and move \`TENNOSCOPE_COMMIT\` in release.yml. Builds keep working meanwhile: they use the pinned commit."
              echo
              echo '```'
              cat apply-errors.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            ok=0
          fi
          if [ "$newer" -gt 0 ]; then
            {
              echo
              echo "### New in TennoScope since \`$pinned\`"
              git -C tennoscope log --format='- `%h` %s (%as)' "$pinned..HEAD"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$GITHUB_STEP_SUMMARY"
          [ "$ok" = 1 ] || { echo "::error::orbiter's TennoScope patch no longer applies to TennoScope main"; exit 1; }
