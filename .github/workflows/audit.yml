name: Dependency audit

# `cargo audit` on both Cargo workspaces (orbiter's Cargo.lock and tennoscope/Cargo.lock) against
# the RustSec advisory database. A known vulnerability fails the run; unmaintained, unsound and
# yanked crates are printed as warnings and don't. It runs when a lockfile changes on main, once a
# week (advisories appear without any change here), by hand, and before every release build
# (release.yml calls it, and builds nothing if it fails).
#
# An advisory is ignored here only with the reason it can't apply, next to its id.

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# One audit per branch at a time; a newer push supersedes a running one. Called from release.yml,
# github.workflow is the caller's ("Release builds"), so a release build's audit has a group of
# its own and an audit run on the same push never cancels it.
concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A prebuilt cargo-audit, checksum-verified by the action; no fallback to building it.
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-audit
          fallback: none

      # cargo-audit is run directly rather than as `cargo audit`, so rustup doesn't install
      # TennoScope's toolchain (tennoscope/rust-toolchain.toml) only to read a lockfile.
      - name: orbiter (Cargo.lock)
        if: ${{ !cancelled() }}
        run: cargo-audit audit --file Cargo.lock

      # zip 4 (RUSTSEC-2026-0367, -0368, -0369, -0429: extraction of a hostile archive) is only in
      # tauri-plugin-updater's Windows path, which extracts an update only after its minisign
      # signature checks out, and TennoScope as orbiter builds it never runs its updater
      # (tennoscope/ORBITER.md). zip 9 comes with tauri-plugin-updater 2.14, which needs Tauri 2.12
      # and @tauri-apps/plugin-updater 2.14: drop these ignores when TennoScope moves to them.
      - name: TennoScope (tennoscope/Cargo.lock)
        if: ${{ !cancelled() }}
        run: >-
          cargo-audit audit --file tennoscope/Cargo.lock
          --ignore RUSTSEC-2026-0367
          --ignore RUSTSEC-2026-0368
          --ignore RUSTSEC-2026-0369
          --ignore RUSTSEC-2026-0429
