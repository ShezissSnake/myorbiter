name: Release builds

# Builds orbiter for Linux and the Steam Deck (one AppImage), Windows (an installer) and macOS
# (a .dmg), each a single download with nothing else to install. The Linux and Windows builds carry
# TennoScope inside them, built from tennoscope/ in this repository (TennoScope with orbiter's
# changes, see tennoscope/ORBITER.md), with its Tesseract; TennoScope doesn't run on macOS, so the
# Mac build goes without it. orbiter and TennoScope are GPL-3.0-only, so every run also attaches
# orbiter-source.tar.gz, the complete source of the commit it built.
#
# Run it from the Actions tab (Run workflow), or push a tag like `v0.2.0`. Every run puts its
# downloads on a pre-release of its own (Releases, on the repository's page): `build-<n>` for a
# run started by hand, the tag's name for a tag. Release files don't count against the Actions
# storage limit, which a free account's private repository fills with one of these builds, so
# nothing is passed between jobs as an artifact: each system builds TennoScope and orbiter in one
# job and attaches its own file.
#
# Actions minutes: a private repository on the free plan gets 2,000 a month, and Windows minutes
# count double and macOS ten times. A run started by hand builds Linux and Windows (about 45
# minutes' worth) unless told otherwise: Windows can be left out (about 15), and macOS is only built
# when asked for (about 20 more). A version tag builds all three.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      windows:
        description: "Windows installer (its minutes count double)"
        type: boolean
        default: true
      macos:
        description: "macOS dmg (its minutes count ten times)"
        type: boolean
        default: false

# Read-only unless a job says otherwise: only the jobs that create the release or attach files to it
# may write, and only their `gh release` steps get the token (GH_TOKEN). Every action is pinned to a
# commit (Dependabot, .github/dependabot.yml, proposes updates), every checkout leaves no
# credentials behind in .git, and every Cargo build uses its Cargo.lock as committed (--locked).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Where this run's downloads go.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}

jobs:
  release:
    name: Make the pre-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "orbiter $RELEASE_TAG" \
            --notes "Built from ${GITHUB_SHA::7}. The AppImage is for Linux and the Steam Deck, the setup.exe for Windows, the .dmg for macOS (Apple silicon), whichever this run built. orbiter and the TennoScope inside it are GPL-3.0-only: orbiter-source.tar.gz is the complete source of this build."

  # ------------------------------------------------------------------ Linux and the Steam Deck

  linux:
    name: Linux / Steam Deck AppImage
    needs: release
    # Writes only to attach its file to the release (the last step, the one with the token).
    permissions:
      contents: write
    # Ubuntu 22.04 like TennoScope's own AppImage: what's built here needs nothing newer than its
    # C library (2.35), so it runs on SteamOS and any Linux from the last few years.
    runs-on: ubuntu-22.04
    steps:
      # Two Rust builds in one job: make room by dropping toolchains this job never uses.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # TennoScope's own list (its release workflow), plus patchelf for the Tesseract below.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libclang-dev libgbm-dev libegl-dev libwayland-dev libxcb1-dev \
            libdbus-1-dev libarchive-tools meson ninja-build gettext tesseract-ocr tesseract-ocr-eng patchelf

      # Jammy's PipeWire is too old for TennoScope's screen-capture bindings: the same pinned
      # build its release uses.
      - name: Build the PipeWire client libraries
        env:
          PIPEWIRE_VERSION: '1.0.0'
          PIPEWIRE_SHA256: f91ef1d1161b37aae6e21b9671917d97097e2664c83d919ba3a0793d6fbc543d
        run: |
          set -eu
          archive="/tmp/pipewire-${PIPEWIRE_VERSION}.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/${PIPEWIRE_VERSION}/pipewire-${PIPEWIRE_VERSION}.tar.gz"
          echo "${PIPEWIRE_SHA256}  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory /tmp
          cd "/tmp/pipewire-${PIPEWIRE_VERSION}"
          meson setup build --prefix="$HOME/pw/prefix" -Dauto_features=disabled -Ddbus=disabled \
            -Dflatpak=disabled -Dpipewire-alsa=disabled -Dpipewire-jack=disabled \
            -Dpipewire-v4l2=disabled -Dexamples=disabled -Dtests=disabled -Dman=disabled \
            -Ddocs=disabled '-Dsession-managers=[]'
          meson compile -C build
          meson install -C build
          pc_dir=$(dirname "$(find "$HOME/pw/prefix" -name 'libspa-0.2.pc' -print -quit)")
          lib_dir=$(dirname "$pc_dir")
          echo "PKG_CONFIG_PATH=$lib_dir/pkgconfig:${PKG_CONFIG_PATH:-}" >>"$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$lib_dir:${LD_LIBRARY_PATH:-}" >>"$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            tennoscope -> target
            . -> target
          shared-key: linux

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: tennoscope/app/package.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: tennoscope/app/.node-version
          cache: pnpm
          cache-dependency-path: tennoscope/app/pnpm-lock.yaml

      # A Tesseract that needs nothing from the system, inside TennoScope's AppImage, where
      # TennoScope looks first (`tesseract/` in its resources, as
      # tennoscope/app/src-tauri/tauri.linux.conf.json lists them, with no updater files: the copy
      # inside orbiter never updates itself).
      - name: Put Tesseract inside TennoScope
        run: scripts/vendor-linux-tesseract.sh tennoscope/app/src-tauri/vendor/tesseract

      - run: pnpm install --frozen-lockfile
        working-directory: tennoscope/app

      # TennoScope's AppImage script runs `tauri build` itself, without --locked: this fails the
      # job first if tennoscope/Cargo.lock doesn't match its Cargo.toml files, so that build can't
      # resolve different versions than the ones committed.
      - name: Check TennoScope's Cargo.lock is current
        run: cargo metadata --locked --format-version 1 >/dev/null
        working-directory: tennoscope

      # TennoScope's own AppImage build: it forces X11 for the reward overlay and repacks.
      - name: Build TennoScope
        run: ./scripts/build-linux-bundles.sh --skip-gates appimage
        working-directory: tennoscope

      - name: Put TennoScope beside orbiter's sources
        run: |
          mkdir -p vendor/tennoscope
          cp tennoscope/target/release/bundle/appimage/*.AppImage vendor/tennoscope/TennoScope.AppImage
          chmod +x vendor/tennoscope/TennoScope.AppImage
          cp tennoscope/LICENSE vendor/tennoscope/LICENSE
          scripts/tennoscope-notice.sh vendor/tennoscope

      - name: Build orbiter
        run: |
          npm ci
          npx tauri build --bundles appimage --config src-tauri/tauri.bundle.json -- --locked
          scripts/repack-appimage.sh

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" target/release/bundle/appimage/*.AppImage --repo "$GITHUB_REPOSITORY" --clobber

  # ------------------------------------------------------------------ Windows

  windows:
    name: Windows installer
    needs: release
    # Writes only to attach its file to the release (the last step, the one with the token).
    permissions:
      contents: write
    if: github.event_name != 'workflow_dispatch' || inputs.windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Check files out as committed, with Unix line endings: the bash scripts this job runs
      # (scripts/tennoscope-notice.sh) stop at a carriage return.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # TennoScope's own script: downloads its pinned Tesseract and proves it runs.
      - name: Vendor Tesseract
        run: ./scripts/vendor-windows-tesseract.ps1
        shell: pwsh
        working-directory: tennoscope

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            tennoscope -> target
            . -> target
          shared-key: windows

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: tennoscope/app/package.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: tennoscope/app/.node-version
          cache: pnpm
          cache-dependency-path: tennoscope/app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: tennoscope/app

      # The program alone: orbiter's installer carries it, beside its Tesseract.
      - name: Build TennoScope
        run: pnpm tauri build --no-bundle -- --locked
        working-directory: tennoscope/app

      - name: Put TennoScope beside orbiter's sources
        run: |
          mkdir -p vendor/tennoscope/tesseract
          cp tennoscope/target/release/tennoscope.exe vendor/tennoscope/
          cp -r tennoscope/app/src-tauri/vendor/tesseract/* vendor/tennoscope/tesseract/
          cp tennoscope/LICENSE vendor/tennoscope/LICENSE
          scripts/tennoscope-notice.sh vendor/tennoscope

      - name: Build orbiter
        run: |
          npm ci
          npx tauri build --config src-tauri/tauri.bundle.json -- --locked

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" target/release/bundle/nsis/*-setup.exe --repo "$GITHUB_REPOSITORY" --clobber

  # ------------------------------------------------------------------ macOS

  macos:
    name: macOS dmg
    needs: release
    # Writes only to attach its file to the release (the last step, the one with the token).
    permissions:
      contents: write
    if: github.event_name != 'workflow_dispatch' || inputs.macos
    # Apple silicon, which is what Warframe on the Mac runs on.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Build orbiter
        run: |
          npm ci
          npx tauri build -- --locked

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" target/release/bundle/dmg/*.dmg --repo "$GITHUB_REPOSITORY" --clobber

  # ------------------------------------------------------------------ Source

  # The complete source of what's shipped (orbiter and TennoScope are GPL-3.0-only): the commit this
  # run built, orbiter and tennoscope/ both, with the workflow and scripts that build them.
  source:
    name: Source
    needs: release
    # Writes only to attach its file to the release (the last step, the one with the token).
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Pack and attach it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=tar.gz --prefix="orbiter-$RELEASE_TAG/" --output orbiter-source.tar.gz "$GITHUB_SHA"
          gh release upload "$RELEASE_TAG" orbiter-source.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
