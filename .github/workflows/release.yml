name: Release builds

# Builds orbiter for Linux and the Steam Deck (one AppImage), Windows (an installer) and macOS
# (a .dmg), each a single download with nothing else to install. The Linux and Windows builds carry
# TennoScope inside them, built from tennoscope/ in this repository (TennoScope with orbiter's
# changes, see tennoscope/ORBITER.md), with its Tesseract; TennoScope doesn't run on macOS, so the
# Mac build goes without it. orbiter and TennoScope are GPL-3.0-only, so every release also carries
# orbiter-source.tar.gz, the complete source of the commit it built.
#
# Every push to main builds, and so does Run workflow on the Actions tab. Each run is build <n>
# (the run number): version 0.2.<n>, its downloads on a pre-release of its own, `build-<n>`
# (Releases, on the repository's page). Only a run on main publishes; a run started by hand on any
# other branch builds the same files and leaves them as the run's artifacts, for 3 days.
#
# The jobs, and what each one may do:
#
#   audit ─┬─ linux ───┐   build jobs: read-only token, no secrets; each uploads its unsigned
#          ├─ windows ─┤   download as an artifact
#          └─ macos ───┘
#                      └─ sign       the release-signing environment's signing key, read-only token;
#                           │        installs and builds nothing (scripts/updater-sign.mjs, plain
#                           │        Node), signs the AppImage and the setup.exe, checks each
#                           │        signature against tauri.conf.json's public key
#                           └─ assemble   read-only: the source tarball, the release notes,
#                                │        latest.json (every signature checked again) and SHA256SUMS
#                                ├─ attest     once public: GitHub's build provenance for SHA256SUMS
#                                └─ publish    the only job that writes: checks every file against
#                                     │        SHA256SUMS, makes the build-<n> pre-release with all of
#                                     │        them, and moves channel-experimental to it
#                                     └─ cleanup   deletes this run's artifacts, now on the release
#
# The build jobs run npm, pnpm and Cargo build code, third-party actions and caches; anything that
# runs there can read whatever the job holds, so they hold nothing worth taking. The signing key is
# read only by `sign`, and only by its signing step's environment; the write token only by
# `publish`, which checks out no code and runs only gh and coreutils.
#
# Updates (src-tauri/src/updates.rs): with the signing key in the release-signing environment's
# secrets (TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD; docs/maintaining.md), the
# AppImage and the Windows installer are signed and `latest.json` (scripts/updater-manifest.mjs)
# goes on the build's release. A build with both the Linux and Windows downloads then becomes the
# Experimental channel's: its latest.json is copied to the `channel-experimental` release, where
# installed copies on Experimental look. Beta and Stable get a build by hand, the same files
# (promote.yml). Without the secret the build is still published, with no updater files, and says
# so in its summary.
#
# The builds don't make Tauri's own updater files (`createUpdaterArtifacts`): with it on, `tauri
# build` signs as it bundles and stops without the key ("A public key has been found, but no private
# key"). Off, it makes the same AppImage and setup.exe, unsigned; Tauri v2's updater takes those two
# files as they are (an AppImage replaces itself; on Windows a setup.exe is run as the installer),
# so the sign job only adds their .sig files.
#
# Actions minutes: a private repository on the free plan gets 2,000 a month, and Windows minutes
# count double and macOS ten times. While the repository is private, pushes build nothing (each
# job's `if`), so only runs started by hand spend minutes; once it's public (unlimited minutes),
# every push builds Linux and Windows. A run started by hand builds Linux and Windows (about 45
# minutes' worth) unless told otherwise: Windows can be left out (about 15), and macOS is only
# built when asked for (about 20 more; it has no updater files, Macs update by hand).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      windows:
        description: "Windows installer (its minutes count double)"
        type: boolean
        default: true
      macos:
        description: "macOS dmg (its minutes count ten times)"
        type: boolean
        default: false

# No token permissions unless a job asks: the build jobs and most others read, `publish` alone writes
# contents, `cleanup` alone deletes artifacts, `attest` alone makes attestations. Every action is
# pinned to a commit (Dependabot, .github/dependabot.yml, proposes updates), every checkout leaves no
# credentials behind in .git, and every Cargo build uses its Cargo.lock as committed (--locked).
permissions: {}

# A newer push cancels a push build still running; nothing of a build is published before its last
# jobs, so a cancelled one leaves at most unpublished artifacts. Runs started by hand are a group of
# their own and are never cancelled.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always
  # Where this run's downloads go, and the version they carry: the same build number, kept when the
  # build moves to another channel. Local builds stay 0.1.0 (tauri.conf.json).
  RELEASE_TAG: build-${{ github.run_number }}
  # 0.2: the run numbers started again when the repository moved, and every build has to be
  # newer than the 0.1.<n> builds already installed, or the updater would never offer it.
  VERSION: 0.2.${{ github.run_number }}

jobs:
  # A known vulnerability in either Cargo.lock stops the run before anything is built.
  #
  # Every job runs for a run started by hand, and for a push only once the repository is public.
  audit:
    name: Dependency audit
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    permissions:
      contents: read
    # `./` in a job's `uses` already resolves at the commit that's running, as `$/` does.
    uses: ./.github/workflows/audit.yml # zizmor: ignore[self-repository]

  # ------------------------------------------------------------------ Linux and the Steam Deck

  linux:
    name: Linux / Steam Deck AppImage
    needs: audit
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    permissions:
      contents: read
    # Ubuntu 22.04 like TennoScope's own AppImage: what's built here needs nothing newer than its
    # C library (2.35), so it runs on SteamOS and any Linux from the last few years.
    runs-on: ubuntu-22.04
    steps:
      # Two Rust builds in one job: make room by dropping toolchains this job never uses.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # TennoScope's own list (its release workflow), plus patchelf for the Tesseract below.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libclang-dev libgbm-dev libegl-dev libwayland-dev libxcb1-dev \
            libdbus-1-dev libarchive-tools meson ninja-build gettext tesseract-ocr tesseract-ocr-eng patchelf

      # Jammy's PipeWire is too old for TennoScope's screen-capture bindings: the same pinned
      # build its release uses.
      - name: Build the PipeWire client libraries
        env:
          PIPEWIRE_VERSION: '1.0.0'
          PIPEWIRE_SHA256: f91ef1d1161b37aae6e21b9671917d97097e2664c83d919ba3a0793d6fbc543d
        run: |
          set -eu
          archive="/tmp/pipewire-${PIPEWIRE_VERSION}.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/${PIPEWIRE_VERSION}/pipewire-${PIPEWIRE_VERSION}.tar.gz"
          echo "${PIPEWIRE_SHA256}  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory /tmp
          cd "/tmp/pipewire-${PIPEWIRE_VERSION}"
          meson setup build --prefix="$HOME/pw/prefix" -Dauto_features=disabled -Ddbus=disabled \
            -Dflatpak=disabled -Dpipewire-alsa=disabled -Dpipewire-jack=disabled \
            -Dpipewire-v4l2=disabled -Dexamples=disabled -Dtests=disabled -Dman=disabled \
            -Ddocs=disabled '-Dsession-managers=[]'
          meson compile -C build
          meson install -C build
          pc_dir=$(dirname "$(find "$HOME/pw/prefix" -name 'libspa-0.2.pc' -print -quit)")
          lib_dir=$(dirname "$pc_dir")
          echo "PKG_CONFIG_PATH=$lib_dir/pkgconfig:${PKG_CONFIG_PATH:-}" >>"$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$lib_dir:${LD_LIBRARY_PATH:-}" >>"$GITHUB_ENV"

      # The build caches (Cargo's, pnpm's, npm's) stay in the build jobs, which hold no secret and no
      # write token. A run on main restores only caches saved by runs on main (GitHub scopes caches by
      # branch, and no workflow here runs for pull requests), so what it restores came from this same
      # workflow on main. None of the jobs after the builds use a cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            tennoscope -> target
            . -> target
          shared-key: linux

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: tennoscope/app/package.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: tennoscope/app/.node-version
          cache: pnpm
          cache-dependency-path: tennoscope/app/pnpm-lock.yaml

      # A Tesseract that needs nothing from the system, inside TennoScope's AppImage, where
      # TennoScope looks first (`tesseract/` in its resources, as
      # tennoscope/app/src-tauri/tauri.linux.conf.json lists them, with no updater files: the copy
      # inside orbiter never updates itself).
      - name: Put Tesseract inside TennoScope
        run: scripts/vendor-linux-tesseract.sh tennoscope/app/src-tauri/vendor/tesseract

      - run: pnpm install --frozen-lockfile
        working-directory: tennoscope/app

      # TennoScope's AppImage script runs `tauri build` itself, without --locked: this fails the
      # job first if tennoscope/Cargo.lock doesn't match its Cargo.toml files, so that build can't
      # resolve different versions than the ones committed.
      - name: Check TennoScope's Cargo.lock is current
        run: cargo metadata --locked --format-version 1 >/dev/null
        working-directory: tennoscope

      # TennoScope's own AppImage build: it forces X11 for the reward overlay and repacks.
      - name: Build TennoScope
        run: ./scripts/build-linux-bundles.sh --skip-gates appimage
        working-directory: tennoscope

      - name: Put TennoScope beside orbiter's sources
        run: |
          mkdir -p vendor/tennoscope
          cp tennoscope/target/release/bundle/appimage/*.AppImage vendor/tennoscope/TennoScope.AppImage
          chmod +x vendor/tennoscope/TennoScope.AppImage
          # Its licence, its notices and its Tesseract's, and NOTICE.md (where its source is).
          scripts/tennoscope-notice.sh vendor/tennoscope

      # The version goes into this build only (tauri.conf.json keeps 0.1.0 for local builds). No
      # updater files and no key here: the sign job signs the final AppImage, after the repack.
      - name: Build orbiter
        run: |
          npm ci
          npx tauri build --bundles appimage --config src-tauri/tauri.bundle.json --config "{\"version\":\"$VERSION\"}" -- --locked
          scripts/repack-appimage.sh

      # The update check's address is fixed in the code; a build made for the end-to-end test of
      # updating (the e2e-updater feature) can be pointed elsewhere, and must never ship.
      - name: Check the updater can't be redirected
        run: |
          if grep -q ORBITER_UPDATER_E2E target/release/orbiter; then
            echo "::error::this binary was built with the e2e-updater feature"; exit 1
          fi

      # Kept for 3 days: long enough to re-run a failed sign or publish, short enough not to fill a
      # private repository's artifact storage (cleanup deletes them once they're on the release).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-linux
          path: target/release/bundle/appimage/orbiter_${{ env.VERSION }}_amd64.AppImage
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Say where the files are
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref_name }}
        run: echo "**Not published:** built from \`$REF\`, not main. The downloads are this run's artifacts, for 3 days." >>"$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ Windows

  windows:
    name: Windows installer
    needs: audit
    if: (github.event_name == 'workflow_dispatch' && inputs.windows) || (github.event_name == 'push' && !github.event.repository.private)
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Check files out as committed, with Unix line endings: the bash scripts this job runs
      # (scripts/tennoscope-notice.sh) stop at a carriage return.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # TennoScope's own script: downloads its pinned Tesseract and proves it runs.
      - name: Vendor Tesseract
        run: ./scripts/vendor-windows-tesseract.ps1
        shell: pwsh
        working-directory: tennoscope

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            tennoscope -> target
            . -> target
          shared-key: windows

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: tennoscope/app/package.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: tennoscope/app/.node-version
          cache: pnpm
          cache-dependency-path: tennoscope/app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: tennoscope/app

      # The program alone: orbiter's installer carries it, beside its Tesseract.
      - name: Build TennoScope
        run: pnpm tauri build --no-bundle -- --locked
        working-directory: tennoscope/app

      - name: Put TennoScope beside orbiter's sources
        run: |
          mkdir -p vendor/tennoscope/tesseract
          cp tennoscope/target/release/tennoscope.exe vendor/tennoscope/
          cp -r tennoscope/app/src-tauri/vendor/tesseract/* vendor/tennoscope/tesseract/
          # Its licence, its notices and its Tesseract's, and NOTICE.md (where its source is).
          scripts/tennoscope-notice.sh vendor/tennoscope

      # No updater files and no key here: the sign job signs the installer.
      - name: Build orbiter
        run: |
          npm ci
          npx tauri build --config src-tauri/tauri.bundle.json --config "{\"version\":\"$VERSION\"}" -- --locked

      - name: Check the updater can't be redirected
        run: |
          if grep -q ORBITER_UPDATER_E2E target/release/orbiter.exe; then
            echo "::error::this binary was built with the e2e-updater feature"; exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-windows
          path: target/release/bundle/nsis/orbiter_${{ env.VERSION }}_x64-setup.exe
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  # ------------------------------------------------------------------ macOS

  macos:
    name: macOS dmg
    needs: audit
    # Only when asked for: no updater files (the manifest leaves macOS out, Macs update by hand).
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    permissions:
      contents: read
    # Apple silicon, which is what Warframe on the Mac runs on.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Build orbiter
        run: |
          npm ci
          npx tauri build --config "{\"version\":\"$VERSION\"}" -- --locked

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-macos
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  # ------------------------------------------------------------------ Signing

  # Signs the AppImage and the setup.exe for the updater. Runs only on main, once every build that
  # was asked for has succeeded. The key comes from the release-signing environment, where protection
  # rules (required reviewers, main only) can hold this job until approved (docs/maintaining.md).
  #
  # This job runs two GitHub actions (checkout, download-artifact) and the repository's own
  # dependency-free scripts with the runner's preinstalled Node: no package manager, no build, no
  # cache. The key is in the environment of the signing step alone, and scripts/updater-sign.mjs
  # never prints it.
  sign:
    name: Sign the updater downloads
    needs: [linux, windows, macos]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
      && needs.linux.result == 'success'
      && (needs.windows.result == 'success' || needs.windows.result == 'skipped')
      && (needs.macos.result == 'success' || needs.macos.result == 'skipped') }}
    runs-on: ubuntu-24.04
    environment: release-signing
    permissions:
      contents: read
    env:
      # Whether the key is there, as true or false: the key itself goes only to the signing step.
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      # The signer, the manifest script (its signature check) and the public key, at this commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/updater-sign.mjs
            scripts/updater-manifest.mjs
            src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false

      # Every build's download (the dmg too, unused here): only the two named below are signed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: signed
          merge-multiple: true

      - name: Check for the signing key
        id: key
        run: |
          if [ "$HAS_SIGNING_KEY" = true ]; then
            echo "signed=true" >>"$GITHUB_OUTPUT"
          else
            echo "signed=false" >>"$GITHUB_OUTPUT"
            echo "**No updater files:** the TAURI_SIGNING_PRIVATE_KEY secret isn't set for the release-signing environment, so this build is unsigned and no channel will offer it (README, Release channels)." >>"$GITHUB_STEP_SUMMARY"
          fi

      # Exactly this build's two downloads, by name; each signature is bound to this version and
      # checked against tauri.conf.json's public key before it's written.
      - name: Sign them
        if: steps.key.outputs.signed == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          files=("signed/orbiter_${VERSION}_amd64.AppImage")
          if [ -f "signed/orbiter_${VERSION}_x64-setup.exe" ]; then files+=("signed/orbiter_${VERSION}_x64-setup.exe"); fi
          node scripts/updater-sign.mjs --version "$VERSION" "${files[@]}"

      # Once more, in a step without the key, with the manifest script's check (the app's).
      - name: Check the signatures
        if: steps.key.outputs.signed == 'true'
        run: |
          set -euo pipefail
          for sig in signed/*.sig; do
            node scripts/updater-manifest.mjs verify --file "${sig%.sig}" --sig "$sig" --version "$VERSION"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.key.outputs.signed == 'true'
        with:
          name: signatures
          path: signed/*.sig
          if-no-files-found: error
          retention-days: 3

  # ------------------------------------------------------------------ Release files

  # Everything else the release carries, read-only: orbiter-source.tar.gz, latest.json and
  # SHA256SUMS. latest.json holds this build's version, its notes (the commit subjects since the build
  # on Experimental), and each signed download at this build's release, every signature checked again
  # against tauri.conf.json's public key (scripts/updater-manifest.mjs). Windows is in it when it
  # was built.
  assemble:
    name: Release files
    needs: [sign]
    if: ${{ !cancelled() && needs.sign.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      complete: ${{ steps.manifest.outputs.complete }}
    steps:
      # The whole history, for the commit subjects since the last Experimental build.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: release-files
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.sign.outputs.signed == 'true'
        with:
          name: signatures
          path: release-files

      # The complete source of what's shipped (orbiter and TennoScope are GPL-3.0-only): the commit
      # this run built, orbiter and tennoscope/ both, with the workflow and scripts that build them.
      - name: Source
        run: git archive --format=tar.gz --prefix="orbiter-$RELEASE_TAG/" --output release-files/orbiter-source.tar.gz "$GITHUB_SHA"

      - name: Release notes
        if: needs.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          prev=""
          if gh release download channel-experimental --repo "$GITHUB_REPOSITORY" --pattern latest.json --output "$RUNNER_TEMP/previous.json" 2>/dev/null; then
            prev=$(jq -r '.commit // empty' "$RUNNER_TEMP/previous.json")
          fi
          if [[ "$prev" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$prev" "$GITHUB_SHA" 2>/dev/null; then
            git log --format=%s "$prev..$GITHUB_SHA" | node scripts/updater-manifest.mjs notes >"$RUNNER_TEMP/notes.txt"
          else
            git log -n 15 --format=%s "$GITHUB_SHA" | node scripts/updater-manifest.mjs notes >"$RUNNER_TEMP/notes.txt"
          fi
          cat "$RUNNER_TEMP/notes.txt"

      - name: Make latest.json
        id: manifest
        if: needs.sign.outputs.signed == 'true'
        run: |
          set -euo pipefail
          node scripts/updater-manifest.mjs manifest --dir release-files --version "$VERSION" --tag "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/notes.txt" --out release-files/latest.json
          if node scripts/updater-manifest.mjs check --manifest release-files/latest.json --version "$VERSION" \
              --require linux-x86_64,windows-x86_64 --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"; then
            echo "complete=true" >>"$GITHUB_OUTPUT"
          else
            echo "complete=false" >>"$GITHUB_OUTPUT"
            echo "**Not for a channel:** this build has no Windows installer, so it stays off Experimental (and can't be promoted)." >>"$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "### Updater manifest for $VERSION"
            echo '```json'
            cat release-files/latest.json
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # SHA256SUMS for every file the release carries, beside them, so a download can be checked
      # (README, Checking a download); publish attaches exactly the files it lists.
      - name: Checksums
        working-directory: release-files
        run: |
          set -euo pipefail
          sha256sum -- * >"$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-meta
          path: |
            release-files/SHA256SUMS
            release-files/latest.json
            release-files/orbiter-source.tar.gz
          if-no-files-found: error
          retention-days: 3

  # ------------------------------------------------------------------ Provenance

  # Once the repository is public, GitHub also records where the files were built (build
  # provenance: `gh attestation verify`); private repositories on the free plan can't, so this job
  # waits until then.
  attest:
    name: Record where they were built
    needs: [assemble]
    if: ${{ !cancelled() && needs.assemble.result == 'success' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # the OIDC token Sigstore signs the attestation with
      attestations: write # to store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-meta
          path: release-files

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release-files/SHA256SUMS

  # ------------------------------------------------------------------ Publish

  # The build-<n> pre-release with every file, then Experimental. The only job with a write token: it
  # checks out nothing and runs only gh and coreutils on the artifacts the jobs above made, and
  # attaches a file only if SHA256SUMS lists it with that checksum. Last, so a build only reaches a
  # channel once everything before it worked.
  publish:
    name: Publish
    needs: [sign, assemble, attest]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
      && needs.assemble.result == 'success'
      && (needs.attest.result == 'success' || needs.attest.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to make the build-<n> release and update channel-experimental
    env:
      SIGNED: ${{ needs.sign.outputs.signed }}
      COMPLETE: ${{ needs.assemble.outputs.complete }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: release-files
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.sign.outputs.signed == 'true'
        with:
          name: signatures
          path: release-files

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-meta
          path: release-files

      # The files here are exactly the ones SHA256SUMS lists, each with its checksum.
      - name: Check the files
        working-directory: release-files
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS
          diff <(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort) <(cut -c67- SHA256SUMS | sort)

      - name: Make the pre-release
        working-directory: release-files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(*)
          # A re-run finds the release made by the first attempt and replaces its files.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --title "orbiter $VERSION ($RELEASE_TAG)" \
              --notes "orbiter $VERSION, built from ${GITHUB_SHA::7}. The AppImage is for Linux and the Steam Deck, the setup.exe for Windows, the .dmg for macOS (Apple silicon), whichever this run built. orbiter and the TennoScope inside it are GPL-3.0-only: orbiter-source.tar.gz is the complete source of this build."
          fi
          if [ "$SIGNED" != true ]; then
            echo "**Published without updater files:** no signing key, so no channel offers $VERSION." >>"$GITHUB_STEP_SUMMARY"
          fi

      # The build becomes Experimental's: its latest.json goes on the `channel-experimental` release
      # (made the first time), which installed copies on Experimental read. Never backwards: a run
      # that finishes after a newer one leaves the channel on the newer build.
      - name: Publish to Experimental
        if: env.COMPLETE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=""
          if gh release download channel-experimental --repo "$GITHUB_REPOSITORY" --pattern latest.json --output "$RUNNER_TEMP/current.json" 2>/dev/null; then
            current=$(jq -r '.version // empty' "$RUNNER_TEMP/current.json")
          fi
          if [ -n "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]; then
            echo "Experimental stays on $current, newer than $VERSION." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! gh release view channel-experimental --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create channel-experimental --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --title "Experimental channel" \
              --notes "An update channel, not a build: orbiter copies on Experimental read latest.json here to find their next update. It names the newest build on the channel; the downloads are on that build's own release (build-<n>)."
          fi
          gh release upload channel-experimental release-files/latest.json --repo "$GITHUB_REPOSITORY" --clobber
          echo "**$VERSION is now Experimental's build.** Promote it with Actions → Promote a build (build $GITHUB_RUN_NUMBER)." >>"$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ Cleanup

  # Everything is on the release now: this run's artifacts are deleted rather than left to expire,
  # so they hold a private repository's artifact storage for as short a time as possible.
  cleanup:
    name: Delete the artifacts
    needs: [publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write # to delete this run's artifacts
    steps:
      - name: Delete them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].id' |
            while read -r id; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            done
