name: Release builds

# Builds orbiter for Linux and the Steam Deck (one AppImage), Windows (an installer) and macOS
# (a .dmg), each a single download with nothing else to install. The Linux and Windows builds carry
# TennoScope inside them, built from tennoscope/ in this repository (TennoScope with orbiter's
# changes, see tennoscope/ORBITER.md), with its Tesseract; TennoScope doesn't run on macOS, so the
# Mac build goes without it. orbiter and TennoScope are GPL-3.0-only, so every run also attaches
# orbiter-source.tar.gz, the complete source of the commit it built.
#
# Every push to main builds, and so does Run workflow on the Actions tab. Each run is build <n>
# (the run number): version 0.1.<n>, its downloads on a pre-release of its own, `build-<n>`
# (Releases, on the repository's page). Release files don't count against the Actions storage
# limit, which a free account's private repository fills with one of these builds, so nothing is
# passed between jobs as an artifact: each system builds TennoScope and orbiter in one job and
# attaches its own file.
#
# Updates (src-tauri/src/updates.rs): with the signing key in the repository's secrets
# (TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD), the AppImage and the Windows
# installer are signed, each signature is checked against the public key in tauri.conf.json, and
# `latest.json` (scripts/updater-manifest.mjs) goes on the build's release. A build with both the
# Linux and Windows downloads then becomes the Experimental channel's: its latest.json is copied to
# the `channel-experimental` release, where installed copies on Experimental look. Beta and Stable
# get a build by hand, the same files (promote.yml). Without the secret the build still succeeds,
# with no updater files, and says so in its summary.
#
# Actions minutes: a private repository on the free plan gets 2,000 a month, and Windows minutes
# count double and macOS ten times. While the repository is private, pushes build nothing (each
# job's `if`), so only runs started by hand spend minutes; once it's public (unlimited minutes),
# every push builds Linux and Windows. A run started by hand builds Linux and Windows (about 45
# minutes' worth) unless told otherwise: Windows can be left out (about 15), and macOS is only
# built when asked for (about 20 more; it has no updater files, Macs update by hand).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      windows:
        description: "Windows installer (its minutes count double)"
        type: boolean
        default: true
      macos:
        description: "macOS dmg (its minutes count ten times)"
        type: boolean
        default: false

# Read-only unless a job says otherwise: only the jobs that create the release or attach files to it
# may write, and only their `gh release` steps get the token (GH_TOKEN). Every action is pinned to a
# commit (Dependabot, .github/dependabot.yml, proposes updates), every checkout leaves no
# credentials behind in .git, and every Cargo build uses its Cargo.lock as committed (--locked).
permissions:
  contents: read

# A newer push cancels a push build still running (its build-<n> pre-release stays, unfinished, and
# never reaches a channel). Runs started by hand are a group of their own and are never cancelled.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always
  # Where this run's downloads go, and the version they carry: the same build number, kept when the
  # build moves to another channel. Local builds stay 0.1.0 (tauri.conf.json).
  RELEASE_TAG: build-${{ github.run_number }}
  VERSION: 0.1.${{ github.run_number }}

jobs:
  # A known vulnerability in either Cargo.lock stops the run before anything is built.
  #
  # Every job runs for a run started by hand, and for a push only once the repository is public.
  audit:
    name: Dependency audit
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    uses: ./.github/workflows/audit.yml

  release:
    name: Make the pre-release
    needs: audit
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "orbiter $VERSION ($RELEASE_TAG)" \
            --notes "orbiter $VERSION, built from ${GITHUB_SHA::7}. The AppImage is for Linux and the Steam Deck, the setup.exe for Windows, the .dmg for macOS (Apple silicon), whichever this run built. orbiter and the TennoScope inside it are GPL-3.0-only: orbiter-source.tar.gz is the complete source of this build."

  # ------------------------------------------------------------------ Linux and the Steam Deck

  linux:
    name: Linux / Steam Deck AppImage
    needs: release
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    # Writes only to attach its file to the release (the last step, the one with the token).
    permissions:
      contents: write
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    # Ubuntu 22.04 like TennoScope's own AppImage: what's built here needs nothing newer than its
    # C library (2.35), so it runs on SteamOS and any Linux from the last few years.
    runs-on: ubuntu-22.04
    steps:
      # Two Rust builds in one job: make room by dropping toolchains this job never uses.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # TennoScope's own list (its release workflow), plus patchelf for the Tesseract below.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libclang-dev libgbm-dev libegl-dev libwayland-dev libxcb1-dev \
            libdbus-1-dev libarchive-tools meson ninja-build gettext tesseract-ocr tesseract-ocr-eng patchelf

      # Jammy's PipeWire is too old for TennoScope's screen-capture bindings: the same pinned
      # build its release uses.
      - name: Build the PipeWire client libraries
        env:
          PIPEWIRE_VERSION: '1.0.0'
          PIPEWIRE_SHA256: f91ef1d1161b37aae6e21b9671917d97097e2664c83d919ba3a0793d6fbc543d
        run: |
          set -eu
          archive="/tmp/pipewire-${PIPEWIRE_VERSION}.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/${PIPEWIRE_VERSION}/pipewire-${PIPEWIRE_VERSION}.tar.gz"
          echo "${PIPEWIRE_SHA256}  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory /tmp
          cd "/tmp/pipewire-${PIPEWIRE_VERSION}"
          meson setup build --prefix="$HOME/pw/prefix" -Dauto_features=disabled -Ddbus=disabled \
            -Dflatpak=disabled -Dpipewire-alsa=disabled -Dpipewire-jack=disabled \
            -Dpipewire-v4l2=disabled -Dexamples=disabled -Dtests=disabled -Dman=disabled \
            -Ddocs=disabled '-Dsession-managers=[]'
          meson compile -C build
          meson install -C build
          pc_dir=$(dirname "$(find "$HOME/pw/prefix" -name 'libspa-0.2.pc' -print -quit)")
          lib_dir=$(dirname "$pc_dir")
          echo "PKG_CONFIG_PATH=$lib_dir/pkgconfig:${PKG_CONFIG_PATH:-}" >>"$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$lib_dir:${LD_LIBRARY_PATH:-}" >>"$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            tennoscope -> target
            . -> target
          shared-key: linux

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: tennoscope/app/package.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: tennoscope/app/.node-version
          cache: pnpm
          cache-dependency-path: tennoscope/app/pnpm-lock.yaml

      # A Tesseract that needs nothing from the system, inside TennoScope's AppImage, where
      # TennoScope looks first (`tesseract/` in its resources, as
      # tennoscope/app/src-tauri/tauri.linux.conf.json lists them, with no updater files: the copy
      # inside orbiter never updates itself).
      - name: Put Tesseract inside TennoScope
        run: scripts/vendor-linux-tesseract.sh tennoscope/app/src-tauri/vendor/tesseract

      - run: pnpm install --frozen-lockfile
        working-directory: tennoscope/app

      # TennoScope's AppImage script runs `tauri build` itself, without --locked: this fails the
      # job first if tennoscope/Cargo.lock doesn't match its Cargo.toml files, so that build can't
      # resolve different versions than the ones committed.
      - name: Check TennoScope's Cargo.lock is current
        run: cargo metadata --locked --format-version 1 >/dev/null
        working-directory: tennoscope

      # TennoScope's own AppImage build: it forces X11 for the reward overlay and repacks.
      - name: Build TennoScope
        run: ./scripts/build-linux-bundles.sh --skip-gates appimage
        working-directory: tennoscope

      - name: Put TennoScope beside orbiter's sources
        run: |
          mkdir -p vendor/tennoscope
          cp tennoscope/target/release/bundle/appimage/*.AppImage vendor/tennoscope/TennoScope.AppImage
          chmod +x vendor/tennoscope/TennoScope.AppImage
          # Its licence, its notices and its Tesseract's, and NOTICE.md (where its source is).
          scripts/tennoscope-notice.sh vendor/tennoscope

      # Whether the updater key is in the secrets: without it the build goes on, unsigned.
      - name: Check for the signing key
        id: signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "signed=true" >>"$GITHUB_OUTPUT"
          else
            echo "signed=false" >>"$GITHUB_OUTPUT"
            echo "**No updater files:** the TAURI_SIGNING_PRIVATE_KEY secret isn't set, so this AppImage is unsigned and no channel will offer it (README, Release channels)." >>"$GITHUB_STEP_SUMMARY"
          fi

      # The version goes into this build only (tauri.conf.json keeps 0.1.0 for local builds); with
      # the key, Tauri also signs the AppImage, though the repack below changes it and it's signed again.
      - name: Build orbiter
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          configs=(--config src-tauri/tauri.bundle.json --config "{\"version\":\"$VERSION\"}")
          if [ "$SIGNED" = true ]; then configs+=(--config '{"bundle":{"createUpdaterArtifacts":true}}'); fi
          npx tauri build --bundles appimage "${configs[@]}" -- --locked
          scripts/repack-appimage.sh

      # The update check's address is fixed in the code; a build made for the end-to-end test of
      # updating (the e2e-updater feature) can be pointed elsewhere, and must never ship.
      - name: Check the updater can't be redirected
        run: |
          if grep -q ORBITER_UPDATER_E2E target/release/orbiter; then
            echo "::error::this binary was built with the e2e-updater feature"; exit 1
          fi

      # repack-appimage.sh rewrote the AppImage Tauri signed: the signature is made again for the
      # final file, bound to this version, and checked against the public key in tauri.conf.json
      # (the one installed copies check with) before anything is attached.
      - name: Sign the AppImage for the updater
        if: steps.signing.outputs.signed == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          appimage=$(ls target/release/bundle/appimage/*.AppImage)
          rm -f "$appimage.sig"
          npx tauri signer sign --app-version "$VERSION" "$appimage" >/dev/null
          node scripts/updater-manifest.mjs verify --file "$appimage" --sig "$appimage.sig" --version "$VERSION"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          files=(target/release/bundle/appimage/*.AppImage)
          if [ "$SIGNED" = true ]; then files+=(target/release/bundle/appimage/*.AppImage.sig); fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  # ------------------------------------------------------------------ Windows

  windows:
    name: Windows installer
    needs: release
    # Writes only to attach its file to the release (the last step, the one with the token).
    permissions:
      contents: write
    if: (github.event_name == 'workflow_dispatch' && inputs.windows) || (github.event_name == 'push' && !github.event.repository.private)
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Check files out as committed, with Unix line endings: the bash scripts this job runs
      # (scripts/tennoscope-notice.sh) stop at a carriage return.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # TennoScope's own script: downloads its pinned Tesseract and proves it runs.
      - name: Vendor Tesseract
        run: ./scripts/vendor-windows-tesseract.ps1
        shell: pwsh
        working-directory: tennoscope

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            tennoscope -> target
            . -> target
          shared-key: windows

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: tennoscope/app/package.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: tennoscope/app/.node-version
          cache: pnpm
          cache-dependency-path: tennoscope/app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: tennoscope/app

      # The program alone: orbiter's installer carries it, beside its Tesseract.
      - name: Build TennoScope
        run: pnpm tauri build --no-bundle -- --locked
        working-directory: tennoscope/app

      - name: Put TennoScope beside orbiter's sources
        run: |
          mkdir -p vendor/tennoscope/tesseract
          cp tennoscope/target/release/tennoscope.exe vendor/tennoscope/
          cp -r tennoscope/app/src-tauri/vendor/tesseract/* vendor/tennoscope/tesseract/
          # Its licence, its notices and its Tesseract's, and NOTICE.md (where its source is).
          scripts/tennoscope-notice.sh vendor/tennoscope

      - name: Check for the signing key
        id: signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "signed=true" >>"$GITHUB_OUTPUT"
          else
            echo "signed=false" >>"$GITHUB_OUTPUT"
            echo "**No updater files:** the TAURI_SIGNING_PRIVATE_KEY secret isn't set, so this installer is unsigned and no channel will offer it (README, Release channels)." >>"$GITHUB_STEP_SUMMARY"
          fi

      # With the key, Tauri signs the installer itself (setup.exe.sig, bound to this version).
      - name: Build orbiter
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          configs=(--config src-tauri/tauri.bundle.json --config "{\"version\":\"$VERSION\"}")
          if [ "$SIGNED" = true ]; then configs+=(--config '{"bundle":{"createUpdaterArtifacts":true}}'); fi
          npx tauri build "${configs[@]}" -- --locked

      - name: Check the updater can't be redirected
        run: |
          if grep -q ORBITER_UPDATER_E2E target/release/orbiter.exe; then
            echo "::error::this binary was built with the e2e-updater feature"; exit 1
          fi

      - name: Check the installer's signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          setup=$(ls target/release/bundle/nsis/*-setup.exe)
          node scripts/updater-manifest.mjs verify --file "$setup" --sig "$setup.sig" --version "$VERSION"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          files=(target/release/bundle/nsis/*-setup.exe)
          if [ "$SIGNED" = true ]; then files+=(target/release/bundle/nsis/*-setup.exe.sig); fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  # ------------------------------------------------------------------ macOS

  macos:
    name: macOS dmg
    needs: release
    # Writes only to attach its file to the release (the last step, the one with the token).
    permissions:
      contents: write
    # Only when asked for: no updater files (the manifest leaves macOS out, Macs update by hand).
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    # Apple silicon, which is what Warframe on the Mac runs on.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Build orbiter
        run: |
          npm ci
          npx tauri build --config "{\"version\":\"$VERSION\"}" -- --locked

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" target/release/bundle/dmg/*.dmg --repo "$GITHUB_REPOSITORY" --clobber

  # ------------------------------------------------------------------ Source

  # The complete source of what's shipped (orbiter and TennoScope are GPL-3.0-only): the commit this
  # run built, orbiter and tennoscope/ both, with the workflow and scripts that build them.
  source:
    name: Source
    needs: release
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    # Writes only to attach its file to the release (the last step, the one with the token).
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Pack and attach it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=tar.gz --prefix="orbiter-$RELEASE_TAG/" --output orbiter-source.tar.gz "$GITHUB_SHA"
          gh release upload "$RELEASE_TAG" orbiter-source.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

  # ------------------------------------------------------------------ Updater manifest

  # latest.json for this build: its version, its notes (the commit subjects since the build on
  # Experimental), and each signed download at this build's release, every signature checked again
  # against tauri.conf.json's public key (scripts/updater-manifest.mjs). Only when Linux was built
  # and signed; Windows is in it when it was built too.
  updater:
    name: Updater manifest
    needs: [release, linux, windows]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.linux.outputs.signed == 'true' && needs.windows.result != 'failure' && needs.windows.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      complete: ${{ steps.manifest.outputs.complete }}
    steps:
      # The whole history, for the commit subjects since the last Experimental build.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          prev=""
          if gh release download channel-experimental --repo "$GITHUB_REPOSITORY" --pattern latest.json --output "$RUNNER_TEMP/previous.json" 2>/dev/null; then
            prev=$(jq -r '.commit // empty' "$RUNNER_TEMP/previous.json")
          fi
          if [[ "$prev" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$prev" "$GITHUB_SHA" 2>/dev/null; then
            git log --format=%s "$prev..$GITHUB_SHA" | node scripts/updater-manifest.mjs notes >"$RUNNER_TEMP/notes.txt"
          else
            git log -n 15 --format=%s "$GITHUB_SHA" | node scripts/updater-manifest.mjs notes >"$RUNNER_TEMP/notes.txt"
          fi
          cat "$RUNNER_TEMP/notes.txt"

      - name: Make latest.json
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern '*.AppImage' --pattern '*.AppImage.sig' --pattern '*-setup.exe' --pattern '*-setup.exe.sig'
          node scripts/updater-manifest.mjs manifest --dir assets --version "$VERSION" --tag "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/notes.txt" --out latest.json
          if node scripts/updater-manifest.mjs check --manifest latest.json --version "$VERSION" --require linux-x86_64,windows-x86_64; then
            echo "complete=true" >>"$GITHUB_OUTPUT"
          else
            echo "complete=false" >>"$GITHUB_OUTPUT"
            echo "**Not for a channel:** this build has no Windows installer, so it stays off Experimental (and can't be promoted)." >>"$GITHUB_STEP_SUMMARY"
          fi
          gh release upload "$RELEASE_TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
          {
            echo "### Updater manifest for $VERSION"
            echo '```json'
            cat latest.json
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ Checksums

  # SHA256SUMS for every file this run attached (whichever builds ran), attached beside them, so a
  # download can be checked (README, Checking a download). Once the repository is public, GitHub
  # also records where they were built (build provenance: `gh attestation verify`); private
  # repositories on the free plan can't, so that step waits until then.
  checksums:
    name: Checksums
    needs: [release, linux, windows, macos, source, updater]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Sum the release's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release-files
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-files
          cd release-files
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Record where they were built
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release-files/SHA256SUMS

      - name: Attach the checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-files/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

  # ------------------------------------------------------------------ Experimental

  # The build becomes Experimental's: its latest.json goes on the `channel-experimental` release
  # (made the first time), which installed copies on Experimental read. Last, so a build only
  # reaches a channel once everything before it worked.
  experimental:
    name: Publish to Experimental
    needs: [release, updater, checksums]
    if: ${{ !cancelled() && needs.updater.outputs.complete == 'true' && needs.checksums.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Copy latest.json to channel-experimental
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir manifest
          if ! gh release view channel-experimental --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create channel-experimental --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --title "Experimental channel" \
              --notes "An update channel, not a build: orbiter copies on Experimental read latest.json here to find their next update. It names the newest build on the channel; the downloads are on that build's own release (build-<n>)."
          fi
          gh release upload channel-experimental manifest/latest.json --repo "$GITHUB_REPOSITORY" --clobber
          echo "**$VERSION is now Experimental's build.** Promote it with Actions → Promote a build (build $GITHUB_RUN_NUMBER)." >>"$GITHUB_STEP_SUMMARY"
