name: Website

# Builds orbiter's website (scripts/site.mjs: site/, the Guide and What's New from the app's own
# source, demo screenshots only) and publishes it on GitHub Pages. Its download buttons point at
# the files of the latest Stable release (the one GitHub marks Latest), read when it builds; once a
# day it builds again, so a build promoted to Stable shows within a day (Promote's own token can't
# start a workflow), or at once with Run workflow.
#
# Pages has to be switched on first (Settings → Pages → Source: GitHub Actions); while the
# repository is private this builds and checks the site but publishes nothing.
#
# `build` reads the repository and runs npm and the site script with a read-only token and no
# secret; `deploy` runs no code of the repository, only GitHub's deploy action, with the two
# permissions Pages needs.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/site.mjs"
      - "src/lib/tabs/Guide.svelte"
      - "src/lib/whatsNew.ts"
      - "src/lib/FullMode.svelte"
      - "src/lib/ui/**"
      - "src/lib/core/**"
      - "public/game/**"
      - "src-tauri/icons/64x64.png"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions: {}

# One publish at a time; a newer one replaces one still waiting, never one under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      public: ${{ steps.visibility.outputs.public }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Asked of the API: a scheduled run's event doesn't say whether the repository is public.
      - name: Public yet?
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/$REPO" --jq .private)" = false ]; then echo "public=true" >>"$GITHUB_OUTPUT"; else echo "public=false" >>"$GITHUB_OUTPUT"; fi

      # The latest Stable release's files, for the download buttons; none yet, the buttons point
      # at the Releases page.
      - name: Latest Stable release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if gh release view --repo "$REPO" --json tagName,assets >"$RUNNER_TEMP/release.json" 2>"$RUNNER_TEMP/release.err"; then
            echo "RELEASE_ARGS=--release $RUNNER_TEMP/release.json" >>"$GITHUB_ENV"
            echo "Downloads from $(jq -r .tagName "$RUNNER_TEMP/release.json")." >>"$GITHUB_STEP_SUMMARY"
          elif grep -qi "release not found" "$RUNNER_TEMP/release.err"; then
            echo "RELEASE_ARGS=" >>"$GITHUB_ENV"
            echo "No Stable release yet: the download buttons point at Releases." >>"$GITHUB_STEP_SUMMARY"
          else
            # Any other failure (the API, a rate limit): stop, rather than publish without downloads.
            cat "$RUNNER_TEMP/release.err" >&2
            exit 1
          fi

      # --check: every link resolves, external links only to github.com, no dev-*.json anywhere.
      - name: Build the site
        run: node scripts/site.mjs --check $RELEASE_ARGS

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/_site

  deploy:
    name: Publish on Pages
    needs: build
    if: needs.build.outputs.public == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # to publish the site
      id-token: write # Pages checks where the upload came from
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
