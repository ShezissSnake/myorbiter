name: Promote a build

# Moves a build up a channel: Actions → Promote a build → Run workflow (on main), with the build's
# number (the n of its `build-<n>` release, version 0.2.<n>) and the channel. Nothing is built:
# the build's own latest.json, pointing at the files that were tested, is copied to the channel's
# release (`channel-beta` or `channel-stable`, made the first time), where installed copies on that
# channel look for updates (src-tauri/src/updates.rs).
#
# Two jobs. `check` (read-only) checks the build: its release exists, its latest.json is for
# 0.2.<n> with both the Linux and Windows downloads, every download in it is a file on this
# repository's build-<n> release, and each one's signature checks out against the public key in
# tauri.conf.json. `promote` (the only job that writes) checks out nothing and runs no repository
# code: it takes latest.json again, only if it's byte for byte the one `check` passed, and copies
# it. Promoting to Stable also makes the build a full release, GitHub's Latest, and moves Beta up
# to it when Beta's build is older (Beta is never behind Stable).
#
# The inputs reach the scripts only through environment variables, checked first: the build number
# digits only, the channel one of the two choices.

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Build number (the n of build-<n>)"
        required: true
        type: string
      channel:
        description: "Channel"
        required: true
        type: choice
        options: [beta, stable]

permissions: {}

# One promotion at a time, none cancelled half way.
concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  check:
    name: Check the build
    # Run from main only: the checks and the public key are main's.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      BUILD: ${{ inputs.build }}
    outputs:
      manifest-sha256: ${{ steps.check.outputs.manifest-sha256 }}
    steps:
      # For scripts/updater-manifest.mjs and the public key in tauri.conf.json.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/updater-manifest.mjs
            src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false

      - name: Check it
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$BUILD" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "::error::not a build number: digits only"; exit 1; }
          tag="build-$BUILD"
          version="0.2.$BUILD"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null || { echo "::error::there is no release $tag"; exit 1; }
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir build \
            || { echo "::error::$tag has no latest.json: it was built without the signing key, or its manifest step failed"; exit 1; }
          # Its version, both systems, every download on this repository's build-<n> and nowhere else.
          node scripts/updater-manifest.mjs check --manifest build/latest.json --version "$version" \
            --require linux-x86_64,windows-x86_64 --repo "$GITHUB_REPOSITORY" --tag "$tag"
          # The files it points at, checked against the key installed copies use.
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir build \
            --pattern '*.AppImage' --pattern '*-setup.exe'
          for platform in linux-x86_64 windows-x86_64; do
            url=$(jq -r --arg p "$platform" '.platforms[$p].url' build/latest.json)
            file="build/$(basename "$url")"
            [ -f "$file" ] || { echo "::error::$platform: $url isn't on $tag"; exit 1; }
            jq -r --arg p "$platform" '.platforms[$p].signature' build/latest.json >"$file.manifest.sig"
            node scripts/updater-manifest.mjs verify --file "$file" --sig "$file.manifest.sig" --version "$version"
          done
          echo "manifest-sha256=$(sha256sum build/latest.json | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

  promote:
    name: Promote build ${{ inputs.build }} to ${{ inputs.channel }}
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to upload latest.json to the channel's release and edit build-<n>
    env:
      BUILD: ${{ inputs.build }}
      CHANNEL: ${{ inputs.channel }}
      MANIFEST_SHA256: ${{ needs.check.outputs.manifest-sha256 }}
    steps:
      - name: Put it on the channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$BUILD" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "::error::not a build number: digits only"; exit 1; }
          case "$CHANNEL" in
            beta) label=Beta ;;
            stable) label=Stable ;;
            *) echo "::error::not a channel"; exit 1 ;;
          esac
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the check passed no manifest"; exit 1; }
          tag="build-$BUILD"
          echo "TAG=$tag" >>"$GITHUB_ENV"
          echo "VERSION=0.2.$BUILD" >>"$GITHUB_ENV"
          # The manifest the check passed, and no other.
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir build
          echo "$MANIFEST_SHA256  build/latest.json" | sha256sum --check --strict
          # The channel's release, made the first time: a pre-release, so it's never GitHub's Latest.
          if ! gh release view "channel-$CHANNEL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "channel-$CHANNEL" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --title "$label channel" \
              --notes "An update channel, not a build: orbiter copies on $label read latest.json here to find their next update. It names the newest build on the channel; the downloads are on that build's own release (build-<n>)."
          fi
          gh release upload "channel-$CHANNEL" build/latest.json --repo "$GITHUB_REPOSITORY" --clobber
          echo "**0.2.$BUILD ($tag) is now $label's build.**" >>"$GITHUB_STEP_SUMMARY"

      # Stable: the build is a full release and GitHub's Latest (what the repository's page offers),
      # and Beta moves up to it when Beta's build is older, or Beta has none yet.
      - name: Make it the latest release, and catch Beta up
        if: env.CHANNEL == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          beta=""
          if gh release download channel-beta --repo "$GITHUB_REPOSITORY" --pattern latest.json --output beta.json 2>/dev/null; then
            beta=$(jq -r '.version // empty' beta.json)
          fi
          if [ -z "$beta" ] || [ "$(printf '%s\n%s\n' "$beta" "$VERSION" | sort -V | head -n1)" != "$VERSION" ]; then
            if ! gh release view channel-beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create channel-beta --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --prerelease --title "Beta channel" \
                --notes "An update channel, not a build: orbiter copies on Beta read latest.json here to find their next update. It names the newest build on the channel; the downloads are on that build's own release (build-<n>)."
            fi
            gh release upload channel-beta build/latest.json --repo "$GITHUB_REPOSITORY" --clobber
            echo "Beta was ${beta:-empty}: it's now $VERSION too." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "Beta stays on $beta (not older than $VERSION)." >>"$GITHUB_STEP_SUMMARY"
          fi
          echo "$TAG is a full release and the repository's Latest." >>"$GITHUB_STEP_SUMMARY"
