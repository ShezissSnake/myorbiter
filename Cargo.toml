[workspace]
members = ["crates/myorbiter-data", "src-tauri"]
# TennoScope is its own workspace (edition 2024, its own Cargo.lock and toolchain): tennoscope/ORBITER.md.
exclude = ["tennoscope"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
